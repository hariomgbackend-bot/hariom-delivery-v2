<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Test v3</title>
<style>
  body { font-family: sans-serif; background: #111; color: #fff; padding: 16px; margin: 0; }
  button { display: block; width: 100%; padding: 16px; margin: 8px 0; font-size: 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; }
  #log { background: #1a1a1a; border-radius: 8px; padding: 12px; font-size: 12px; font-family: monospace; min-height: 100px; max-height: 300px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; margin: 8px 0; }
  .ok { color:#4ade80; } .err { color:#f87171; } .inf { color:#60a5fa; } .warn { color:#fbbf24; }
  #result { font-size: 20px; font-weight: 800; background: #16a34a; padding: 16px; border-radius: 10px; text-align: center; display: none; margin-top: 8px; word-break: break-all; }
  #preview { width:100%; max-height:180px; object-fit:contain; background:#000; border-radius:8px; display:none; margin:8px 0; }
  h3 { color: #fbbf24; margin: 16px 0 4px; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
</style>
</head>
<body>
<h2>Barcode Test v3</h2>
<div id="log">Checking environment...\n</div>

<h3>Test 1 — BarcodeDetector API (direct)</h3>
<button onclick="testBarcodeDetector()" style="background:#7c3aed">Test BarcodeDetector on Photo</button>
<input type="file" id="input1" accept="image/*" capture="environment" style="display:none" onchange="runBarcodeDetector(this)">

<h3>Test 2 — Quagga2 (best for 1D barcodes)</h3>
<button onclick="testQuagga()" style="background:#0369a1">Test Quagga2 on Photo</button>
<input type="file" id="input2" accept="image/*" capture="environment" style="display:none" onchange="runQuagga(this)">

<h3>Test 3 — bare ZXing decodeFromImageUrl</h3>
<button onclick="testZxingUrl()" style="background:#065f46">Test ZXing URL method</button>
<input type="file" id="input3" accept="image/*" capture="environment" style="display:none" onchange="runZxingUrl(this)">

<img id="preview">
<div id="result"></div>
<button onclick="document.getElementById('log').innerHTML=''; document.getElementById('result').style.display='none'; document.getElementById('preview').style.display='none';" style="background:#374151;padding:10px;font-size:13px">🔄 Clear log</button>

<script>
function log(msg, type='') {
  const d = document.getElementById('log');
  d.innerHTML += `<span class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
  d.scrollTop = d.scrollHeight;
}
function showResult(val) {
  const r = document.getElementById('result');
  r.textContent = '✅ ' + val;
  r.style.display = 'block';
  if (navigator.vibrate) navigator.vibrate([50,30,80]);
}
function showImg(file) {
  const p = document.getElementById('preview');
  p.src = URL.createObjectURL(file);
  p.style.display = 'block';
}

// Environment check
log('UA: ' + navigator.userAgent.substring(0,60), 'inf');
log('BarcodeDetector: ' + ('BarcodeDetector' in window), 'BarcodeDetector' in window ? 'ok' : 'warn');
log('HTTPS: ' + (location.protocol==='https:'), 'inf');

// ── TEST 1: BarcodeDetector ──
function testBarcodeDetector() {
  if (!('BarcodeDetector' in window)) {
    log('BarcodeDetector NOT available on this device', 'err');
    return;
  }
  document.getElementById('input1').click();
}
async function runBarcodeDetector(el) {
  const file = el.files[0]; if (!file) return; el.value='';
  showImg(file);
  log('BarcodeDetector: loading image...', 'inf');
  const img = await createImageBitmap(file);
  log(`Image: ${img.width}x${img.height}`, 'inf');
  try {
    const bd = new BarcodeDetector({ formats: ['code_128','code_39','ean_13','ean_8','upc_a','upc_e','qr_code','data_matrix','pdf417','aztec','codabar','itf'] });
    const results = await bd.detect(img);
    if (results.length) {
      log('BarcodeDetector SUCCESS: ' + results[0].rawValue, 'ok');
      showResult(results[0].rawValue);
    } else {
      log('BarcodeDetector: no barcode detected', 'err');
    }
  } catch(e) { log('BarcodeDetector error: ' + e, 'err'); }
}

// ── TEST 2: Quagga2 ──
function testQuagga() { document.getElementById('input2').click(); }
async function runQuagga(el) {
  const file = el.files[0]; if (!file) return; el.value='';
  showImg(file);
  log('Loading Quagga2...', 'inf');
  await new Promise((res,rej) => {
    if (window.Quagga) { res(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.4.2/dist/quagga.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  }).catch(() => log('Quagga2 failed to load', 'err'));

  if (!window.Quagga) return;
  log('Quagga2 loaded ✓', 'ok');

  const objUrl = URL.createObjectURL(file);
  log('Decoding...', 'inf');

  Quagga.decodeSingle({
    decoder: { readers: ['code_128_reader','code_39_reader','ean_reader','ean_8_reader','upc_reader','upc_e_reader','codabar_reader','i2of5_reader'] },
    locate: true,
    src: objUrl
  }, result => {
    URL.revokeObjectURL(objUrl);
    if (result && result.codeResult) {
      log('Quagga SUCCESS: ' + result.codeResult.code + ' (' + result.codeResult.format + ')', 'ok');
      showResult(result.codeResult.code);
    } else {
      log('Quagga: no barcode found', 'err');
    }
  });
}

// ── TEST 3: ZXing decodeFromImageUrl ──
function testZxingUrl() { document.getElementById('input3').click(); }
async function runZxingUrl(el) {
  const file = el.files[0]; if (!file) return; el.value='';
  showImg(file);
  log('Loading ZXing...', 'inf');
  await new Promise((res,rej) => {
    if (window.ZXing) { res(); return; }
    const s = document.createElement('script');
    s.src = 'https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js';
    s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  }).catch(() => log('ZXing failed to load','err'));
  if (!window.ZXing) return;
  log('ZXing loaded ✓', 'ok');

  const objUrl = URL.createObjectURL(file);
  const reader = new ZXing.BrowserMultiFormatReader();
  log('Decoding via decodeFromImageUrl...', 'inf');
  try {
    const result = await reader.decodeFromImageUrl(objUrl);
    URL.revokeObjectURL(objUrl);
    log('ZXing SUCCESS: ' + result.getText(), 'ok');
    showResult(result.getText());
  } catch(e) {
    URL.revokeObjectURL(objUrl);
    log('ZXing failed: ' + e, 'err');
  }
}
</script>
</body>
</html>
