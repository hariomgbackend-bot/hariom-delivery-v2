<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Barcode Test</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family:sans-serif; color:#fff; }
  #scannerOverlay { position:fixed; inset:0; z-index:9999; background:#000; display:none; }
  #viewfinderCanvas { width:100%; height:100%; object-fit:cover; display:block; }
  #scanUi { position:absolute; inset:0; pointer-events:none; }
  #barcodeFrame {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:85vw; height:110px;
    border-radius:8px;
  }
  #barcodeFrame::before,#barcodeFrame::after,#barcodeFrame .bl,#barcodeFrame .br {
    content:""; position:absolute; width:24px; height:24px;
    border-color:#3b82f6; border-style:solid;
  }
  #barcodeFrame::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
  #barcodeFrame::after{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
  #barcodeFrame .bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
  #barcodeFrame .br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
  #laser {
    position:absolute; left:10px; right:10px; height:2px; top:10px;
    background:linear-gradient(90deg,transparent,#3b82f6,#93c5fd,#3b82f6,transparent);
    animation:laserAnim 2s ease-in-out infinite; box-shadow:0 0 8px #3b82f6;
  }
  @keyframes laserAnim{0%,100%{top:8px;}50%{top:calc(100% - 10px);}}
  #scanHint{position:absolute;bottom:90px;width:100%;text-align:center;color:rgba(255,255,255,0.75);font-size:14px;}
  #closeBtn{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;background:rgba(255,255,255,0.2);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;pointer-events:auto;z-index:10;display:flex;align-items:center;justify-content:center;}
  #statusBar{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:16px;background:rgba(0,0,0,0.65);padding:6px 14px;border-radius:20px;font-size:12px;font-family:monospace;pointer-events:none;}
  #mainPage{padding:24px 16px;}
  #log{background:#1a1a1a;border-radius:8px;padding:12px;font-size:12px;font-family:monospace;min-height:80px;max-height:220px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;margin:12px 0;}
  .ok{color:#4ade80;}.err{color:#f87171;}.inf{color:#60a5fa;}
  #result{font-size:20px;font-weight:800;background:#16a34a;padding:16px;border-radius:10px;text-align:center;display:none;margin:8px 0;word-break:break-all;}
  .btn{display:block;width:100%;padding:16px;margin:8px 0;font-size:17px;border-radius:10px;border:none;cursor:pointer;font-weight:bold;}
</style>
</head>
<body>

<div id="scannerOverlay">
  <canvas id="viewfinderCanvas"></canvas>
  <div id="scanUi">
    <div id="barcodeFrame">
      <span class="bl"></span><span class="br"></span>
      <div id="laser"></div>
    </div>
    <div id="scanHint">Align barcode within the frame</div>
  </div>
  <button id="closeBtn">✕</button>
  <div id="statusBar">Starting...</div>
</div>

<video id="hiddenVideo" muted playsinline webkit-playsinline
  style="position:absolute;width:1px;height:1px;opacity:0.01;pointer-events:none;top:0;left:0;"></video>

<div id="mainPage">
  <h2 style="margin-bottom:4px">Server Barcode Test</h2>
  <p style="color:#aaa;font-size:13px;margin-bottom:4px">Canvas → capture frame → POST to /decode-barcode → pyzbar Python</p>
  <div id="log">Ready.\n</div>
  <button class="btn" onclick="openScanner()" style="background:#1d4ed8">📷 Open Scanner</button>
  <div id="result"></div>
  <button class="btn" onclick="document.getElementById('log').innerHTML='Ready.\n';document.getElementById('result').style.display='none';" style="background:#374151;font-size:13px;padding:10px">🔄 Clear</button>
</div>

<script>
function log(msg, type='') {
  const d = document.getElementById('log');
  d.innerHTML += `<span class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
  d.scrollTop = d.scrollHeight;
}

let isScanning = false;
let frameCount = 0;
let animFrame  = null;
let stream     = null;
let sending    = false; // prevent concurrent POSTs

async function openScanner() {
  log('Starting camera...', 'inf');
  document.getElementById('scannerOverlay').style.display = 'block';
  document.getElementById('statusBar').textContent = 'Starting...';

  const video  = document.getElementById('hiddenVideo');
  const canvas = document.getElementById('viewfinderCanvas');
  const ctx    = canvas.getContext('2d', { alpha: false });

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = stream;
    await video.play();
    log(`Camera OK ${video.videoWidth}x${video.videoHeight}`, 'ok');
  } catch(e) {
    log('Camera error: ' + e.message, 'err');
    closeScanner(); return;
  }

  isScanning = true;
  frameCount = 0;
  document.getElementById('statusBar').textContent = '● Scanning...';

  async function renderLoop() {
    if (!isScanning) return;

    if (video.videoWidth > 0 && canvas.width !== video.videoWidth) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
      log(`Canvas ${canvas.width}x${canvas.height}`, 'inf');
    }

    if (video.readyState >= 2 && canvas.width > 0) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Send to server every 10 frames (~3x/sec at 30fps), don't stack requests
      if (frameCount % 10 === 0 && !sending) {
        sending = true;
        canvas.toBlob(async (blob) => {
          try {
            const fd = new FormData();
            fd.append('image', blob, 'frame.jpg');
            const res  = await fetch('/decode-barcode', { method: 'POST', body: fd });
            const data = await res.json();
            if (data.found) {
              log('✅ DECODED: ' + data.value, 'ok');
              onScanned(data.value);
            }
          } catch(e) {
            log('Server error: ' + e.message, 'err');
          } finally {
            sending = false;
          }
        }, 'image/jpeg', 0.85);
      }
    }

    frameCount++;
    animFrame = requestAnimationFrame(renderLoop);
  }

  renderLoop();
}

function onScanned(value) {
  isScanning = false;
  cancelAnimationFrame(animFrame);
  if (navigator.vibrate) navigator.vibrate([50,30,80]);
  document.getElementById('statusBar').textContent = '✅ Done!';
  setTimeout(() => {
    closeScanner();
    const r = document.getElementById('result');
    r.textContent = '✅ ' + value;
    r.style.display = 'block';
  }, 300);
}

function closeScanner() {
  isScanning = false;
  sending = false;
  cancelAnimationFrame(animFrame);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('hiddenVideo').srcObject = null;
  document.getElementById('scannerOverlay').style.display = 'none';
  log('Closed', 'inf');
}

document.getElementById('closeBtn').addEventListener('touchend', e => {
  e.preventDefault(); closeScanner();
}, { passive: false });
document.getElementById('closeBtn').addEventListener('click', closeScanner);
</script>
</body>
</html>
