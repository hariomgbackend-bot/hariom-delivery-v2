<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server Barcode Test v2</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family:sans-serif; color:#fff; }
  #scannerOverlay { position:fixed; inset:0; z-index:9999; background:#000; display:none; }
  #viewfinderCanvas { width:100%; height:100%; object-fit:cover; display:block; }
  #scanUi { position:absolute; inset:0; pointer-events:none; }
  #barcodeFrame {
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%);
    width:85vw; height:110px; border-radius:8px;
  }
  #barcodeFrame::before,#barcodeFrame::after,#barcodeFrame .bl,#barcodeFrame .br {
    content:""; position:absolute; width:24px; height:24px;
    border-color:#3b82f6; border-style:solid;
  }
  #barcodeFrame::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
  #barcodeFrame::after{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
  #barcodeFrame .bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
  #barcodeFrame .br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
  #laser {
    position:absolute; left:10px; right:10px; height:2px; top:10px;
    background:linear-gradient(90deg,transparent,#3b82f6,#93c5fd,#3b82f6,transparent);
    animation:laserAnim 2s ease-in-out infinite; box-shadow:0 0 8px #3b82f6;
  }
  @keyframes laserAnim{0%,100%{top:8px;}50%{top:calc(100% - 10px);}}
  #scanHint{position:absolute;bottom:80px;width:100%;text-align:center;color:rgba(255,255,255,0.8);font-size:14px;}
  #closeBtn{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));right:16px;width:44px;height:44px;background:rgba(255,255,255,0.25);border:none;border-radius:50%;color:#fff;font-size:20px;cursor:pointer;pointer-events:auto;z-index:10;display:flex;align-items:center;justify-content:center;}
  #statusBar{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:72px;right:70px;background:rgba(0,0,0,0.7);padding:6px 12px;border-radius:20px;font-size:11px;font-family:monospace;pointer-events:none;}
  #mainPage{padding:20px 16px;}
  #logWrap { position:relative; margin:10px 0; }
  #log{background:#1a1a1a;border-radius:8px;padding:10px;padding-top:36px;font-size:11px;font-family:monospace;min-height:100px;max-height:300px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;}
  #copyLogBtn{position:absolute;top:6px;right:6px;background:#374151;color:#9ca3af;border:none;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:monospace;z-index:2;}
  #copyLogBtn:active{background:#4b5563;}
  .ok{color:#4ade80;}.err{color:#f87171;}.inf{color:#60a5fa;}.warn{color:#fbbf24;}
  #result{font-size:20px;font-weight:800;background:#16a34a;padding:16px;border-radius:10px;text-align:center;display:none;margin:8px 0;word-break:break-all;}
  .btn{display:block;width:100%;padding:14px;margin:6px 0;font-size:16px;border-radius:10px;border:none;cursor:pointer;font-weight:bold;}
</style>
</head>
<body>

<div id="scannerOverlay">
  <canvas id="viewfinderCanvas"></canvas>
  <div id="scanUi">
    <div id="barcodeFrame">
      <span class="bl"></span><span class="br"></span>
      <div id="laser"></div>
    </div>
    <div id="scanHint">Align barcode within the frame</div>
  </div>
  <button id="closeBtn">✕</button>
  <button id="torchBtn" style="position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:16px;width:44px;height:44px;background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.4);border-radius:50%;color:#fff;font-size:20px;cursor:pointer;pointer-events:auto;z-index:10;display:flex;align-items:center;justify-content:center;">🔦</button>
  <div id="statusBar">Starting...</div>
</div>

<video id="hiddenVideo" muted playsinline webkit-playsinline
  style="position:absolute;width:1px;height:1px;opacity:0.01;pointer-events:none;top:0;left:0;"></video>

<div id="mainPage">
  <h2 style="margin-bottom:4px">Server Barcode Test v2</h2>
  <div id="logWrap">
    <button id="copyLogBtn" onclick="copyLog()">📋 Copy</button>
    <div id="log">Ready.\n</div>
  </div>
  <button class="btn" onclick="openScanner()" style="background:#1d4ed8">📷 Open Scanner</button>
  <button class="btn" id="nightScanBtn" onclick="nightScan()" style="background:#1e3a5f">🌙 Night Scan</button>
  <button class="btn" onclick="runTorchDiagnostic()" style="background:#b45309">🔦 Torch Diagnostic (no camera needed)</button>
  <button class="btn" onclick="localStorage.removeItem('torchCameraId');log('Torch camera cache cleared','ok')" style="background:#374151;font-size:13px;padding:10px">🗑 Clear Torch Camera Cache</button>
  <button class="btn" onclick="testEndpoint()" style="background:#7c3aed">🔌 Test /decode-barcode endpoint</button>
  <div id="result"></div>
  <button class="btn" onclick="document.getElementById('log').innerHTML='Ready.\n';document.getElementById('result').style.display='none';" style="background:#374151;font-size:13px;padding:10px">🔄 Clear</button>
</div>

<script>
function log(msg, type='') {
  const d = document.getElementById('log');
  d.innerHTML += `<span class="${type}">[${new Date().toLocaleTimeString()}] ${msg}</span>\n`;
  d.scrollTop = d.scrollHeight;
}

function copyLog() {
  const d = document.getElementById('log');
  const text = d.innerText || d.textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyLogBtn');
    btn.textContent = '✅ Copied';
    setTimeout(() => btn.textContent = '📋 Copy', 1500);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const btn = document.getElementById('copyLogBtn');
    btn.textContent = '✅ Copied';
    setTimeout(() => btn.textContent = '📋 Copy', 1500);
  });
}

// Test endpoint is alive with a blank image
async function testEndpoint() {
  log('Testing /decode-barcode endpoint...', 'inf');
  try {
    // Send a tiny blank canvas as test
    const c = document.createElement('canvas');
    c.width = 10; c.height = 10;
    await new Promise(res => c.toBlob(async blob => {
      const fd = new FormData();
      fd.append('image', blob, 'test.jpg');
      const r = await fetch('/decode-barcode', { method:'POST', body:fd });
      const d = await r.json();
      log('Endpoint response: ' + JSON.stringify(d), r.ok ? 'ok' : 'err');
      res();
    }, 'image/jpeg'));
  } catch(e) {
    log('Endpoint error: ' + e.message, 'err');
  }
}

let isScanning = false;
let frameCount = 0;
let animFrame  = null;
let stream     = null;
let sending    = false;
let decodeCount = 0;
let successCount = 0;

async function openScanner() {
  log('Opening scanner...', 'inf');
  document.getElementById('scannerOverlay').style.display = 'block';
  document.getElementById('statusBar').textContent = 'Starting camera...';
  document.getElementById('result').style.display = 'none';

  const video  = document.getElementById('hiddenVideo');
  const canvas = document.getElementById('viewfinderCanvas');
  const ctx    = canvas.getContext('2d', { alpha: false });

  try {
    const preferredCamId = localStorage.getItem('torchCameraId') || null;
    const baseVideoConstraints = preferredCamId
      ? {
          deviceId: { exact: preferredCamId },
          width: { ideal: 1280 }, height: { ideal: 720 }
        }
      : {
          facingMode: 'environment',
          width: { ideal: 1280 }, height: { ideal: 720 }
        };

    // CRITICAL: fillLightMode must be declared at stream-open time.
    // applyConstraints alone succeeds silently but doesn't fire the LED.
    // Pre-declaring it here tells Chrome to open the camera pipeline with
    // torch capability registered, so applyConstraints activates the LED.
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: Object.assign({}, baseVideoConstraints, {
          advanced: [{ fillLightMode: 'none' }]
        })
      });
      log('✅ Camera open with fillLightMode pre-declared: ' + (stream.getVideoTracks()[0]?.label || '(no label)') +
          (preferredCamId ? ' [preferred torch camera]' : ''), 'ok');
    } catch(_) {
      // Fallback for devices that don't accept fillLightMode in getUserMedia
      stream = await navigator.mediaDevices.getUserMedia({
        video: baseVideoConstraints
      });
      log('✅ Camera open (plain stream): ' + (stream.getVideoTracks()[0]?.label || '(no label)') +
          (preferredCamId ? ' [preferred torch camera]' : ''), 'ok');
    }
    video.srcObject = stream;
    await video.play();
    log('Resolution: ' + video.videoWidth + 'x' + video.videoHeight, 'ok');
  } catch(e) {
    log('❌ Camera error: ' + e.message, 'err');
    closeScanner(); return;
  }

  isScanning  = true;
  frameCount  = 0;
  decodeCount = 0;
  sending     = false;
  torchOn     = false;
  const _tb = document.getElementById('torchBtn');
  if (_tb) { _tb.style.background = 'rgba(255,255,255,0.25)'; _tb.style.borderColor = 'rgba(255,255,255,0.4)'; }
  document.getElementById('statusBar').textContent = '● Scanning...';

  async function renderLoop() {
    if (!isScanning) return;

    if (video.videoWidth > 0 && canvas.width !== video.videoWidth) {
      canvas.width  = video.videoWidth;
      canvas.height = video.videoHeight;
    }

    if (video.readyState >= 2 && canvas.width > 0) {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Send every 15 frames, don't stack requests
      if (frameCount % 15 === 0 && !sending) {
        sending = true;
        decodeCount++;
        const attempt = decodeCount;
        document.getElementById('statusBar').textContent = `● Sending frame #${attempt}...`;

        canvas.toBlob(async (blob) => {
          log(`→ Sending frame #${attempt} (${(blob.size/1024).toFixed(0)}KB)`, 'inf');
          try {
            const fd = new FormData();
            fd.append('image', blob, 'frame.jpg');
            const res  = await fetch('/decode-barcode', { method: 'POST', body: fd });
            const data = await res.json();
            log(`← Frame #${attempt}: ${JSON.stringify(data)}`, data.found ? 'ok' : 'warn');
            if (data.found) {
              onScanned(data.value);
            } else {
              document.getElementById('statusBar').textContent = `● Scanning... (${attempt} tried)`;
            }
          } catch(e) {
            log(`← Frame #${attempt} ERROR: ${e.message}`, 'err');
            document.getElementById('statusBar').textContent = '⚠ Server error';
          } finally {
            sending = false;
          }
        }, 'image/jpeg', 0.9);
      }
    }

    frameCount++;
    animFrame = requestAnimationFrame(renderLoop);
  }

  renderLoop();
}

function onScanned(value) {
  isScanning = false;
  cancelAnimationFrame(animFrame);
  if (navigator.vibrate) navigator.vibrate([50,30,80]);
  setTimeout(() => {
    closeScanner();
    const r = document.getElementById('result');
    r.textContent = '✅ ' + value;
    r.style.display = 'block';
  }, 300);
}

function closeScanner() {
  isScanning = false;
  sending = false;
  cancelAnimationFrame(animFrame);
  // Turn off torch BEFORE stopping stream — try fillLightMode first (works on this device)
  if (torchOn && stream) {
    const t = stream.getVideoTracks()[0];
    if (t) {
      t.applyConstraints({ advanced: [{ fillLightMode: 'none' }] }).catch(() =>
        t.applyConstraints({ advanced: [{ torch: false }] }).catch(() => {})
      );
    }
    torchOn = false;
  }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  document.getElementById('hiddenVideo').srcObject = null;
  document.getElementById('scannerOverlay').style.display = 'none';
  log(`Closed after ${decodeCount} decode attempts`, 'inf');
}

document.getElementById('closeBtn').addEventListener('touchend', e => {
  e.preventDefault(); closeScanner();
}, { passive: false });
document.getElementById('closeBtn').addEventListener('click', closeScanner);

/* ═══════════════════════════════════════════
   TORCH DIAGNOSTIC — runs without opening scanner
   Opens its own stream just to probe capabilities
═══════════════════════════════════════════ */
async function runTorchDiagnostic() {
  log('━━━ TORCH DIAGNOSTIC ━━━', 'inf');

  // ── Step 0: List ALL cameras ──
  log('─── Step 0: Enumerating all cameras ───', 'inf');
  try {
    // Need to request camera permission first so labels are visible
    const tmpStream = await navigator.mediaDevices.getUserMedia({ video: true });
    tmpStream.getTracks().forEach(t => t.stop());
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    log('Total cameras found: ' + cams.length, 'inf');
    cams.forEach((c, i) => log('  [' + i + '] ' + (c.label || '(no label)') + ' | id: ' + c.deviceId.slice(0,16), 'inf'));
  } catch(e) {
    log('Enumeration failed: ' + e.message, 'err');
  }

  log('─── Step 1: Testing each rear camera for torch ───', 'inf');
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cams = devices.filter(d => d.kind === 'videoinput');
    for (const cam of cams) {
      const label = cam.label || cam.deviceId.slice(0, 16);
      if (/front|selfie|user/i.test(cam.label)) { log('  SKIP (front): ' + label, 'warn'); continue; }
      log('  Testing: ' + label, 'inf');
      let ts;
      try {
        ts = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: cam.deviceId } } });
        const tk = ts.getVideoTracks()[0];
        const settingsBefore = tk.getSettings?.() || {};
        // Try fillLightMode
        try {
          await tk.applyConstraints({ advanced: [{ fillLightMode: 'torch' }] });
          const settingsAfter = tk.getSettings?.() || {};
          const actuallyChanged = settingsAfter.fillLightMode === 'torch' || settingsAfter.torch === true;
          if (actuallyChanged) {
            log('  ✅ ' + label + ' → fillLightMode:torch VERIFIED in settings — should be ON', 'ok');
            try {
              localStorage.setItem('torchCameraId', cam.deviceId);
              log('  💾 Saved as preferred torch cameraId (fillLightMode): ' + cam.deviceId.slice(0, 16), 'ok');
            } catch(_) {}
          } else {
            log('  ⚠ ' + label + ' → constraint accepted but settings unchanged (Chrome silent-accept bug)', 'warn');
            log('    settingsBefore.fillLightMode=' + settingsBefore.fillLightMode + ' after=' + settingsAfter.fillLightMode, 'warn');
          }
          await new Promise(r => setTimeout(r, 1500));
          await tk.applyConstraints({ advanced: [{ fillLightMode: 'none' }] });
        } catch(_) {
          try {
            await tk.applyConstraints({ advanced: [{ torch: true }] });
            const settingsAfter = tk.getSettings?.() || {};
            const actuallyChanged = settingsAfter.torch === true;
            if (actuallyChanged) {
              log('  ✅ ' + label + ' → torch:true VERIFIED in settings', 'ok');
              try {
                localStorage.setItem('torchCameraId', cam.deviceId);
                log('  💾 Saved as preferred torch cameraId (torch): ' + cam.deviceId.slice(0, 16), 'ok');
              } catch(_) {}
            } else {
              log('  ⚠ ' + label + ' → torch accepted but settings unchanged (Chrome silent-accept bug)', 'warn');
            }
            await new Promise(r => setTimeout(r, 1500));
            await tk.applyConstraints({ advanced: [{ torch: false }] });
          } catch(_2) {
            log('  ✗ ' + label + ' → no torch response at all', 'warn');
          }
        }
        ts.getTracks().forEach(t => t.stop());
      } catch(e) {
        log('  ✗ ' + label + ' → failed to open: ' + e.message, 'err');
        if (ts) ts.getTracks().forEach(t => t.stop());
      }
    }
  } catch(e) {
    log('Camera loop failed: ' + e.message, 'err');
  }

  log('─── Step 2: Default environment camera test ───', 'inf');
  log('Requesting camera stream (rear)...', 'inf');

  let diagStream;
  try {
    diagStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    log('✅ Camera stream acquired', 'ok');
  } catch(e) {
    log('❌ getUserMedia failed: ' + e.name + ' — ' + e.message, 'err');
    return;
  }

  const track = diagStream.getVideoTracks()[0];
  if (!track) { log('❌ No video track found', 'err'); diagStream.getTracks().forEach(t=>t.stop()); return; }

  log('Track label: ' + (track.label || '(empty)'), 'inf');
  log('Track readyState: ' + track.readyState, 'inf');

  // 1. getCapabilities
  log('─── getCapabilities() ───', 'inf');
  try {
    const caps = track.getCapabilities?.();
    if (!caps) {
      log('⚠ getCapabilities() returned undefined/null', 'warn');
    } else {
      log('Full capabilities: ' + JSON.stringify(caps, null, 2), 'inf');
      log('caps.torch = ' + caps.torch, caps.torch ? 'ok' : 'warn');
      log('caps.fillLightMode = ' + JSON.stringify(caps.fillLightMode), caps.fillLightMode ? 'ok' : 'warn');
    }
  } catch(e) {
    log('❌ getCapabilities() threw: ' + e.message, 'err');
  }

  // 2. getSettings
  log('─── getSettings() ───', 'inf');
  try {
    const settings = track.getSettings?.();
    if (!settings) {
      log('⚠ getSettings() returned undefined/null', 'warn');
    } else {
      log('Full settings: ' + JSON.stringify(settings), 'inf');
      log('settings.torch = ' + settings.torch, 'inf');
    }
  } catch(e) {
    log('❌ getSettings() threw: ' + e.message, 'err');
  }

  // 3. Try applyConstraints torch:true directly
  log('─── applyConstraints({ advanced:[{torch:true}] }) ───', 'inf');
  try {
    await track.applyConstraints({ advanced: [{ torch: true }] });
    log('✅ torch:true SUCCEEDED — flashlight should be ON now', 'ok');
    await new Promise(r => setTimeout(r, 1500));
    await track.applyConstraints({ advanced: [{ torch: false }] });
    log('✅ torch:false SUCCEEDED — flashlight OFF', 'ok');
  } catch(e) {
    log('❌ applyConstraints torch failed: ' + e.name + ' — ' + e.message, 'err');

    // 4. Try fillLightMode fallback
    log('─── applyConstraints({ advanced:[{fillLightMode:"torch"}] }) ───', 'inf');
    try {
      await track.applyConstraints({ advanced: [{ fillLightMode: 'torch' }] });
      log('✅ fillLightMode:torch SUCCEEDED', 'ok');
      await new Promise(r => setTimeout(r, 1500));
      await track.applyConstraints({ advanced: [{ fillLightMode: 'none' }] });
      log('✅ fillLightMode:none (off) SUCCEEDED', 'ok');
    } catch(e2) {
      log('❌ fillLightMode also failed: ' + e2.name + ' — ' + e2.message, 'err');

      // 5. Try top-level constraint (not inside advanced)
      log('─── applyConstraints({ torch:true }) (top-level, no advanced) ───', 'inf');
      try {
        await track.applyConstraints({ torch: true });
        log('✅ top-level torch:true SUCCEEDED', 'ok');
        await new Promise(r => setTimeout(r, 1500));
        await track.applyConstraints({ torch: false });
        log('✅ top-level torch:false SUCCEEDED', 'ok');
      } catch(e3) {
        log('❌ top-level torch also failed: ' + e3.name + ' — ' + e3.message, 'err');
        log('━━━ CONCLUSION: Torch API not available on this device/browser ━━━', 'warn');
      }
    }
  }

  log('─── Stopping diagnostic stream ───', 'inf');
  diagStream.getTracks().forEach(t => t.stop());

  // ── Extra test: open stream WITH fillLightMode declared, then applyConstraints ──
  log('─── EXTRA: stream opened with fillLightMode:none declared upfront ───', 'inf');
  let diagStream2;
  try {
    diagStream2 = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 }, height: { ideal: 720 },
        advanced: [{ fillLightMode: 'none' }]
      }
    });
    log('✅ Stream with fillLightMode:none acquired', 'ok');
    const track2 = diagStream2.getVideoTracks()[0];
    await new Promise(r => setTimeout(r, 500)); // let stream settle
    try {
      await track2.applyConstraints({ advanced: [{ fillLightMode: 'torch' }] });
      log('✅ fillLightMode:torch ON — is flashlight ON now?', 'ok');
      await new Promise(r => setTimeout(r, 2000));
      await track2.applyConstraints({ advanced: [{ fillLightMode: 'none' }] });
      log('✅ fillLightMode:none OFF', 'ok');
    } catch(e) {
      log('❌ applyConstraints after pre-declare failed: ' + e.message, 'err');
    }
    diagStream2.getTracks().forEach(t => t.stop());
  } catch(e) {
    log('❌ Stream with fillLightMode pre-declare failed: ' + e.message, 'err');
  }

  log('━━━ DIAGNOSTIC COMPLETE ━━━', 'inf');
}

/* ═══════════════════════════════════════════
   TORCH TOGGLE — inside active scanner stream
═══════════════════════════════════════════ */
let torchOn = false;

async function toggleTorch() {
  if (!stream) { log('⚠ No active stream — open scanner first', 'warn'); return; }
  const track = stream.getVideoTracks()[0];
  if (!track) { log('⚠ No video track', 'warn'); return; }

  const newState = !torchOn;
  const btn = document.getElementById('torchBtn');
  const caps = track.getCapabilities?.() || {};
  log('Toggling torch → ' + newState + ' | caps.torch=' + caps.torch + ' caps.fillLightMode=' + JSON.stringify(caps.fillLightMode), 'inf');

  // Try all methods — caps can lie (diagnostic proved fillLightMode works even when caps say undefined)
  const tryMethods = [
    { name: 'fillLightMode',       fn: () => track.applyConstraints({ advanced: [{ fillLightMode: newState ? 'torch' : 'none' }] }) },
    { name: 'torch (advanced)',    fn: () => track.applyConstraints({ advanced: [{ torch: newState }] }) },
    { name: 'torch (top-level)',   fn: () => track.applyConstraints({ torch: newState }) },
  ];

  let succeeded = false;
  for (const m of tryMethods) {
    try {
      await m.fn();
      log('✅ ' + m.name + ' succeeded', 'ok');
      succeeded = true;
      break;
    } catch(e) {
      log('✗ ' + m.name + ' failed: ' + e.name, 'warn');
    }
  }

  if (succeeded) {
    torchOn = newState;
    btn.style.background   = torchOn ? 'rgba(253,224,71,0.5)' : 'rgba(255,255,255,0.25)';
    btn.style.borderColor  = torchOn ? '#fde047' : 'rgba(255,255,255,0.4)';
  } else {
    log('❌ All torch methods failed', 'err');
  }
}

/* ═══════════════════════════════════════
   NIGHT SCAN
   Opens camera once → loop: flash photo → greyscale
   → POST → decoded: done | not found: retry
   Tap again to cancel.
═══════════════════════════════════════ */
let nightScanActive = false;

async function nightScan() {
  const btn = document.getElementById('nightScanBtn');

  // Second tap = cancel
  if (nightScanActive) {
    nightScanActive = false;
    return;
  }

  nightScanActive = true;
  btn.textContent = '⏹ Cancel';
  btn.style.background = '#7f1d1d';

  if (typeof ImageCapture === 'undefined') {
    log('❌ ImageCapture not supported on this browser', 'err');
    nightScanActive = false;
    btn.textContent = '🌙 Night Scan';
    btn.style.background = '#1e3a5f';
    return;
  }

  let camStream = null;
  let attempt   = 0;

  try {
    log('Night scan: opening camera...', 'inf');
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    const track = camStream.getVideoTracks()[0];
    log('Camera: ' + track.label, 'inf');
    const ic = new ImageCapture(track);

    // Let camera warm up once
    await new Promise(r => setTimeout(r, 400));

    while (nightScanActive) {
      attempt++;
      btn.textContent = `⏹ Cancel  (#${attempt})`;

      // ── Take photo with flash ──
      let bitmap;
      try {
        bitmap = await ic.takePhoto({ fillLightMode: 'flash', redEyeReduction: false });
      } catch(e) {
        bitmap = await ic.takePhoto();
        if (attempt === 1) log('Flash not supported — shooting without', 'warn');
      }

      // ── Greyscale ──
      const canvas = document.createElement('canvas');
      canvas.width = bitmap.width;
      canvas.height = bitmap.height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(bitmap, 0, 0);
      bitmap.close();

      const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = img.data;
      for (let i = 0; i < d.length; i += 4) {
        const g = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
        d[i] = d[i+1] = d[i+2] = g;
      }
      ctx.putImageData(img, 0, 0);

      // ── POST ──
      const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
      log(`#${attempt} → ${(blob.size/1024).toFixed(0)}KB`, 'inf');

      const fd = new FormData();
      fd.append('image', blob, 'night.jpg');

      let data;
      try {
        const res = await fetch('/decode-barcode', { method: 'POST', body: fd });
        data = await res.json();
      } catch(e) {
        log(`#${attempt} server error: ` + e.message, 'err');
        await new Promise(r => setTimeout(r, 300));
        continue;
      }

      if (data.found) {
        log(`✅ Decoded on attempt ${attempt}: ` + data.value, 'ok');
        const r = document.getElementById('result');
        r.textContent = '✅ ' + data.value;
        r.style.display = 'block';
        if (navigator.vibrate) navigator.vibrate([50, 30, 80]);
        nightScanActive = false;
        break;
      } else {
        log(`#${attempt} not found — retrying...`, 'warn');
        // Brief gap so flash capacitor can recharge
        await new Promise(r => setTimeout(r, 300));
      }
    }

  } catch(e) {
    log('❌ Night scan error: ' + e.message, 'err');
  } finally {
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    nightScanActive = false;
    btn.textContent = '🌙 Night Scan';
    btn.style.background = '#1e3a5f';
    btn.disabled = false;
  }
}
