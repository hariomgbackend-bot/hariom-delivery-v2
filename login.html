<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hariom DMS">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <meta name="theme-color" content="#0f172a">
  <title>Admin Login — Hariom Electronics</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --border: rgba(255,255,255,0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.35);
      --text: #f1f5f9;
      --muted: #64748b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: #3b82f6;
      top: -100px; left: -100px;
    }
    body::after {
      width: 400px; height: 400px;
      background: #6366f1;
      bottom: -80px; right: -80px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .brand h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      letter-spacing: 0.3px;
      color: var(--text);
    }

    .brand p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field input::placeholder { color: var(--muted); }

    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 8px;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .message {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      min-height: 20px;
      color: #f87171;
    }

    /* ═══════════════════════════════════════
       DARK MODE
    ═══════════════════════════════════════ */
    [data-theme="dark"] {
      --bg: #0f1624;
      --surface: #1a2236;
      --border: rgba(255,255,255,0.08);
      --text: #e2e8f4;
      --muted: #8899b4;
      --accent: #4f8ef7;
    }
    [data-theme="dark"] body { background: var(--bg) !important; color: var(--text); }

    /* Cards & surfaces */
    [data-theme="dark"] .stat-card,
    [data-theme="dark"] .card,
    [data-theme="dark"] .toolbar,
    [data-theme="dark"] .table-wrap,
    [data-theme="dark"] .payout-panel,
    [data-theme="dark"] .popup-card,
    [data-theme="dark"] .img-popup-card,
    [data-theme="dark"] .login-card { background: var(--surface) !important; border-color: var(--border) !important; }

    /* Table rows */
    [data-theme="dark"] thead th { background: #0d1520 !important; }
    [data-theme="dark"] tbody td { border-color: var(--border) !important; color: var(--text) !important; }
    [data-theme="dark"] tbody tr.main-row:hover,
    [data-theme="dark"] tbody tr:hover { background: rgba(255,255,255,0.03) !important; filter: none !important; }
    [data-theme="dark"] .detail-expand-inner { background: #111927 !important; border-color: var(--border) !important; }
    [data-theme="dark"] .detail-expand-value { color: var(--text) !important; }
    [data-theme="dark"] .detail-row { border-color: rgba(255,255,255,0.05) !important; }

    /* Row status tints */
    [data-theme="dark"] .row-green  { background: rgba(74,222,128,0.06) !important; }
    [data-theme="dark"] .row-yellow { background: rgba(245,158,11,0.06) !important; }
    [data-theme="dark"] .row-red    { background: rgba(248,113,113,0.07) !important; }
    [data-theme="dark"] .row-gray   { background: rgba(255,255,255,0.02) !important; }

    /* Toolbar & filter buttons */
    [data-theme="dark"] .filter-btn { border-color: rgba(255,255,255,0.1) !important; color: var(--muted) !important; background: transparent !important; }
    [data-theme="dark"] .filter-btn:hover { background: rgba(79,142,247,0.1) !important; color: var(--accent) !important; border-color: var(--accent) !important; }
    [data-theme="dark"] .filter-btn.active { background: var(--accent) !important; border-color: var(--accent) !important; color: white !important; }
    [data-theme="dark"] .filter-btn:not(.active) .filter-count { background: rgba(255,255,255,0.1) !important; color: var(--text) !important; }

    /* Inputs & selects */
    [data-theme="dark"] input:not([type=range]),
    [data-theme="dark"] select,
    [data-theme="dark"] textarea {
      background: #111927 !important;
      color: var(--text) !important;
      border-color: rgba(255,255,255,0.1) !important;
    }
    [data-theme="dark"] input::placeholder { color: var(--muted) !important; }
    [data-theme="dark"] input:focus,
    [data-theme="dark"] select:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(79,142,247,0.15) !important;
    }
    [data-theme="dark"] input:disabled,
    [data-theme="dark"] .field input:disabled { background: #0d1520 !important; color: var(--muted) !important; }

    /* Payout panel */
    [data-theme="dark"] .payout-header:hover { background: rgba(255,255,255,0.03) !important; }
    [data-theme="dark"] .payout-body { border-color: var(--border) !important; background: transparent !important; }
    [data-theme="dark"] #payoutChips > div { background: rgba(255,255,255,0.04) !important; }

    /* Popup overlays */
    [data-theme="dark"] .popup-card h3 { color: var(--text) !important; }
    [data-theme="dark"] .popup-card b { color: #6b7e99 !important; }

    /* Mobile delivery cards */
    [data-theme="dark"] .mob-delivery-card { background: var(--surface) !important; border-color: var(--border) !important; }
    [data-theme="dark"] .mob-batch-grp-hdr { background: rgba(255,255,255,0.03) !important; }

    /* Driver interface specifics */
    [data-theme="dark"] .delivery-card { background: var(--surface) !important; border-color: var(--border) !important; }
    [data-theme="dark"] .delivery-card .dc-label { color: var(--muted) !important; }
    [data-theme="dark"] .section-title { color: var(--muted) !important; }
    [data-theme="dark"] .login-card { background: var(--surface) !important; }
    [data-theme="dark"] select#driverSelect { background: #111927 !important; color: var(--text) !important; }

    /* Driver page field labels */
    [data-theme="dark"] .field label { color: #6b7e99 !important; }

    /* Login page */
    [data-theme="dark"] .brand h1 { color: var(--text) !important; }
    [data-theme="dark"] .brand p { color: var(--muted) !important; }
    [data-theme="dark"] .field label { color: var(--muted) !important; }
    [data-theme="dark"] .message { color: #f87171 !important; }

    /* Dark toggle button */
    .dark-toggle {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      border-radius: 7px;
      padding: 5px 10px;
      font-size: 15px;
      line-height: 1;
      transition: background 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dark-toggle:hover { background: rgba(255,255,255,0.15); color: white; }

  </style>
</head>
<body>


<button class="dark-toggle" id="darkToggleBtn" onclick="toggleDarkMode()" title="Toggle dark / light mode"
  style="position:fixed;top:14px;right:16px;z-index:50;">🌙</button>

<div class="card">
  <div class="brand">
    <div class="brand-icon">🚚</div>
    <h1>Hariom Electronics</h1>
    <p>Delivery Management System</p>
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="admin@example.com" autocomplete="email">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
  </div>

  <button onclick="login()">Sign In</button>
  <div class="message" id="message"></div>
</div>

<script>
const BASE_URL = window.location.origin;

/* ── DARK MODE ───────────────────────────────────────── */
(function() {
  const saved = localStorage.getItem("hariom_theme");
  if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
})();
function toggleDarkMode() {
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  document.documentElement.setAttribute("data-theme", isDark ? "light" : "dark");
  localStorage.setItem("hariom_theme", isDark ? "light" : "dark");
  const btn = document.getElementById("darkToggleBtn");
  if (btn) btn.textContent = isDark ? "🌙" : "☀️";
}
document.addEventListener("DOMContentLoaded", function() {
  const btn = document.getElementById("darkToggleBtn");
  if (btn) btn.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀️" : "🌙";
});
/* ── END DARK MODE ───────────────────────────────────── */



// Show "session expired" message if redirected from admin with ?reason=expired
(function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("reason") === "expired") {
    const msg = document.getElementById("message");
    if (msg) {
      msg.style.color = "#dc2626";
      msg.innerText = "⚠ Your session has expired. Please sign in again.";
    }
  }
})();

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("message");

  if (!email || !password) {
    msg.innerText = "Please enter email and password";
    return;
  }

  const res = await fetch(`${BASE_URL}/admin/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (!res.ok) {
    msg.innerText = data.error || "Login failed";
    return;
  }

  localStorage.setItem("adminToken", data.token);
  window.location.href = "admin.html";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
