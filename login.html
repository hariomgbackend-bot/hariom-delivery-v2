<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hariom DMS">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <meta name="theme-color" content="#0f172a">
  <title>Admin Login — Hariom Electronics</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #08111f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Dot-grid background */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    /* Amber glow at top */
    .glow-orb {
      position: fixed;
      width: 600px; height: 300px;
      background: radial-gradient(ellipse, rgba(245,158,11,0.12) 0%, transparent 70%);
      top: -80px; left: 50%; transform: translateX(-50%);
      pointer-events: none;
    }

    /* Side accent lines */
    .accent-line {
      position: fixed;
      top: 0; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, rgba(245,158,11,0.3), transparent);
      pointer-events: none;
    }
    .accent-line.left { left: 60px; }
    .accent-line.right { right: 60px; }

    .card {
      background: rgba(22, 32, 48, 0.95);
      border: 1px solid rgba(245,158,11,0.2);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.04), 0 30px 80px rgba(0,0,0,0.6);
      animation: rise 0.6s cubic-bezier(0.16,1,0.3,1) both;
      backdrop-filter: blur(20px);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(32px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .brand { text-align: center; margin-bottom: 40px; }

    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 18px;
      font-size: 28px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(245,158,11,0.35);
      animation: pulse-amber 3s ease-in-out infinite;
    }
    @keyframes pulse-amber {
      0%,100% { box-shadow: 0 8px 32px rgba(245,158,11,0.35); }
      50%      { box-shadow: 0 8px 48px rgba(245,158,11,0.55); }
    }

    .brand h1 {
      font-family: 'Syne', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: #e8edf5;
      letter-spacing: -0.5px;
    }

    .brand p {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: #f59e0b;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(245,158,11,0.3), transparent);
      margin: 32px 0;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: flex; align-items: center; gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #6b7f9e;
      margin-bottom: 9px;
    }

    .field label::before {
      content: '';
      display: inline-block;
      width: 3px; height: 3px;
      background: #f59e0b;
      border-radius: 50%;
    }

    .field input {
      width: 100%;
      padding: 13px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #e8edf5;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }
    .field input::placeholder { color: #3d5070; }
    .field input:focus {
      border-color: rgba(245,158,11,0.5);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
      background: rgba(255,255,255,0.06);
    }

    .sign-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #08111f;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      margin-top: 10px;
      box-shadow: 0 6px 24px rgba(245,158,11,0.3);
    }
    .sign-btn:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 10px 30px rgba(245,158,11,0.4); }
    .sign-btn:active { transform: translateY(0); }

    .message {
      text-align: center;
      margin-top: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      min-height: 18px;
      color: #f87171;
      letter-spacing: 0.3px;
    }

    .footer-note {
      text-align: center;
      margin-top: 28px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: #243350;
      letter-spacing: 0.5px;
    }

    @media (max-width: 480px) {
      .card { padding: 36px 24px; border-radius: 16px; }
      .accent-line { display: none; }
    }
  </style>
</head>
<body>

<div class="glow-orb"></div>
<div class="accent-line left"></div>
<div class="accent-line right"></div>

<div class="card">
  <div class="brand">
    <div class="brand-mark">🚚</div>
    <h1>Hariom Electronics</h1>
    <p>Delivery Management System</p>
  </div>

  <div class="divider"></div>

  <div class="field">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="admin@hariom.com" autocomplete="email">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>

  <button class="sign-btn" onclick="login()">Sign In →</button>
  <div class="message" id="message"></div>

  <div class="footer-note">HARIOM ELECTRONICS · DMS v2 · ADMIN ACCESS</div>
</div>

<script>
const BASE_URL = window.location.origin;

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("message");

  if (!email || !password) {
    msg.innerText = "Please enter email and password";
    return;
  }

  const res = await fetch(`${BASE_URL}/admin/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (!res.ok) {
    msg.innerText = data.error || "Login failed";
    return;
  }

  localStorage.setItem("adminToken", data.token);
  window.location.href = "admin.html";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
