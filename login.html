<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hariom DMS">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <meta name="theme-color" content="#0f172a">
  <title>Admin Login — Hariom Electronics</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f1e;
      --surface: #111827;
      --border: rgba(255,255,255,0.08);
      --accent: #3b82f6;
      --accent-glow: rgba(59,130,246,0.35);
      --text: #f1f5f9;
      --muted: #64748b;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Ambient background orbs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: #3b82f6;
      top: -100px; left: -100px;
    }
    body::after {
      width: 400px; height: 400px;
      background: #6366f1;
      bottom: -80px; right: -80px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .brand h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      letter-spacing: 0.3px;
      color: var(--text);
    }

    .brand p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .field input::placeholder { color: var(--muted); }

    button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
      margin-top: 8px;
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    .message {
      text-align: center;
      margin-top: 14px;
      font-size: 13px;
      min-height: 20px;
      color: #f87171;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-icon">🚚</div>
    <h1>Hariom Electronics</h1>
    <p>Delivery Management System</p>
  </div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="admin@example.com" autocomplete="email">
  </div>

  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
  </div>

  <button onclick="login()">Sign In</button>
  <div class="message" id="message"></div>
</div>

<script>
const BASE_URL = window.location.origin;

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const msg = document.getElementById("message");

  if (!email || !password) {
    msg.innerText = "Please enter email and password";
    return;
  }

  const res = await fetch(`${BASE_URL}/admin/login`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await res.json();

  if (!res.ok) {
    msg.innerText = data.error || "Login failed";
    return;
  }

  localStorage.setItem("adminToken", data.token);
  window.location.href = "admin.html";
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
