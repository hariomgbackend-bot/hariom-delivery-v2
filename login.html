<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hariom DMS">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <meta name="theme-color" content="#0b1326">
  <title>Admin Login — Hariom Electronics</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface-variant": "#c2c6d6",
            "outline": "#8c909f",
            "surface-dim": "#0b1326",
            "primary-container": "#4d8eff",
            "error": "#ffb4ab",
            "on-primary": "#002e6a",
            "surface": "#0b1326",
            "surface-container-highest": "#2d3449",
            "on-secondary-fixed": "#111c2d",
            "on-secondary-container": "#aeb9d0",
            "on-primary-fixed-variant": "#004395",
            "tertiary-fixed": "#6ffbbe",
            "on-tertiary-fixed-variant": "#005236",
            "on-error": "#690005",
            "on-surface": "#dae2fd",
            "secondary": "#bcc7de",
            "on-primary-container": "#00285d",
            "on-error-container": "#ffdad6",
            "tertiary-fixed-dim": "#4edea3",
            "surface-container-high": "#222a3d",
            "secondary-fixed-dim": "#bcc7de",
            "on-tertiary-fixed": "#002113",
            "error-container": "#93000a",
            "primary-fixed-dim": "#adc6ff",
            "surface-bright": "#31394d",
            "on-primary-fixed": "#001a42",
            "tertiary-container": "#00a572",
            "outline-variant": "#424754",
            "surface-variant": "#2d3449",
            "primary": "#adc6ff",
            "inverse-surface": "#dae2fd",
            "inverse-primary": "#005ac2",
            "inverse-on-surface": "#283044",
            "surface-container-lowest": "#060e20",
            "on-secondary": "#263143",
            "secondary-container": "#3e495d",
            "primary-fixed": "#d8e2ff",
            "surface-container-low": "#131b2e",
            "tertiary": "#4edea3",
            "secondary-fixed": "#d8e3fb",
            "background": "#0b1326",
            "surface-tint": "#adc6ff",
            "on-secondary-fixed-variant": "#3c475a",
            "on-tertiary": "#003824",
            "on-background": "#dae2fd",
            "surface-container": "#171f33",
            "on-tertiary-container": "#00311f"
          },
          fontFamily: {
            "headline": ["Inter"],
            "body": ["Inter"],
            "label": ["Inter"]
          },
          borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; min-height: max(884px, 100dvh); }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .glass-panel {
      background: rgba(11, 19, 38, 0.6);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
    }
    .kinetic-bg {
      background: radial-gradient(circle at 50% 50%, #171f33 0%, #0b1326 100%);
      overflow: hidden;
      position: relative;
    }
    .kinetic-light {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(77, 142, 255, 0.05) 0%, transparent 70%);
      top: -200px;
      right: -100px;
      pointer-events: none;
    }
    .glow-focus:focus-within {
      box-shadow: 0 0 20px rgba(173, 198, 255, 0.15);
      background: #222a3d;
    }

    /* ── LIGHT MODE OVERRIDES ─────────────────────────────── */
    html:not(.dark) body {
      background: #f0f4ff !important;
      color: #0b1326 !important;
    }
    html:not(.dark) .kinetic-bg {
      background: radial-gradient(circle at 50% 50%, #dde8ff 0%, #f0f4ff 100%) !important;
    }
    html:not(.dark) .kinetic-light {
      background: radial-gradient(circle, rgba(77, 142, 255, 0.08) 0%, transparent 70%) !important;
    }
    html:not(.dark) header {
      background: rgba(240, 244, 255, 0.7) !important;
      border-bottom: 1px solid rgba(77, 142, 255, 0.15) !important;
    }
    html:not(.dark) .glass-panel {
      background: rgba(255, 255, 255, 0.75) !important;
      border: 1px solid rgba(77, 142, 255, 0.15) !important;
      box-shadow: 0 8px 40px rgba(11, 19, 38, 0.1) !important;
    }
    html:not(.dark) .glass-panel input {
      background: #f0f4ff !important;
      color: #0b1326 !important;
    }
    html:not(.dark) .glass-panel input::placeholder { color: #8c909f !important; }
    html:not(.dark) .glow-focus { background: #f0f4ff !important; }
    html:not(.dark) .glow-focus:focus-within { background: #e4eaff !important; }
    html:not(.dark) h1, html:not(.dark) h2 { color: #0b1326 !important; }
    html:not(.dark) .text-on-surface { color: #0b1326 !important; }
    html:not(.dark) footer p, html:not(.dark) footer a { color: #4d8eff !important; opacity: 1 !important; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col kinetic-bg">

  <!-- Top Navigation Bar -->
  <header class="fixed top-0 w-full bg-[#0b1326]/60 backdrop-blur-xl flex justify-between items-center px-6 py-4 z-50 shadow-[0_48px_48px_rgba(0,0,0,0.06)]">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-[#adc6ff]">shield_lock</span>
      <h1 class="font-['Inter'] tracking-tight font-black uppercase text-xl tracking-tighter text-[#adc6ff]">HARIOM ELECTRONICS</h1>
    </div>
    <button class="p-2 rounded-full hover:opacity-80 transition-opacity active:scale-95 duration-200" id="darkToggleBtn" onclick="toggleDarkMode()" title="Toggle dark / light mode">
      <span class="material-symbols-outlined text-[#dae2fd]" id="darkToggleIcon">dark_mode</span>
    </button>
  </header>

  <div class="kinetic-light"></div>

  <!-- Main Login Canvas -->
  <main class="flex-grow flex items-center justify-center px-4 py-20">
    <div class="w-full max-w-md">

      <!-- Branding -->
      <div class="text-center mb-10">
        <span class="text-xs font-bold tracking-[0.4em] text-primary uppercase opacity-60">Delivery Management System</span>
        <h2 class="text-4xl font-extrabold tracking-tighter mt-2 text-on-surface">Secure Portal</h2>
      </div>

      <!-- Glass Login Card -->
      <div class="glass-panel p-8 md:p-10 rounded-lg shadow-2xl border border-outline-variant/10">
        <form class="space-y-6" onsubmit="event.preventDefault(); login();">

          <!-- Email Field -->
          <div class="space-y-2">
            <label class="block text-[10px] font-bold tracking-[0.1em] text-on-surface-variant uppercase ml-1" for="email">Email</label>
            <div class="relative flex items-center glow-focus transition-all duration-300 bg-surface-container-low rounded-md overflow-hidden">
              <span class="material-symbols-outlined absolute left-4 text-outline">alternate_email</span>
              <input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-on-surface placeholder:text-outline-variant focus:ring-0"
                id="email" type="email" placeholder="admin@example.com" autocomplete="email" required>
            </div>
          </div>

          <!-- Password Field -->
          <div class="space-y-2">
            <label class="block text-[10px] font-bold tracking-[0.1em] text-on-surface-variant uppercase ml-1" for="password">Password</label>
            <div class="relative flex items-center glow-focus transition-all duration-300 bg-surface-container-low rounded-md overflow-hidden">
              <span class="material-symbols-outlined absolute left-4 text-outline" style="font-variation-settings:'FILL' 1;">lock</span>
              <input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-on-surface placeholder:text-outline-variant focus:ring-0"
                id="password" type="password" placeholder="••••••••••••" autocomplete="current-password" required>
            </div>
          </div>

          <!-- Feedback Message -->
          <div class="text-sm font-medium min-h-[20px] transition-all text-center" id="message"></div>

          <!-- Sign In Button -->
          <button type="submit"
            class="w-full h-14 bg-gradient-to-br from-primary to-primary-container rounded-md text-on-primary font-bold tracking-tight text-lg shadow-[0_8px_32px_rgba(77,142,255,0.3)] hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
            <span>SIGN IN</span>
            <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </form>
      </div>

      <!-- Security Badge -->
      <div class="mt-8 flex items-center justify-center gap-2 opacity-40">
        <span class="material-symbols-outlined text-sm">verified_user</span>
        <span class="text-[10px] font-medium tracking-[0.2em] uppercase">AES-256 Cloud Security Active</span>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="fixed bottom-8 w-full flex flex-col md:flex-row gap-4 justify-center items-center px-8 opacity-60">
    <p class="font-['Inter'] text-[10px] uppercase tracking-[0.2em] font-medium text-[#4d8eff]">© 2024 HARIOM ELECTRONICS. SECURED INTERFACE.</p>
    <div class="flex gap-6">
      <a class="font-['Inter'] text-[10px] uppercase tracking-[0.2em] font-medium text-[#dae2fd]/50 hover:text-[#4edea3] transition-colors" href="#">Privacy</a>
      <a class="font-['Inter'] text-[10px] uppercase tracking-[0.2em] font-medium text-[#dae2fd]/50 hover:text-[#4edea3] transition-colors" href="#">Support</a>
    </div>
  </footer>

  <script>
    const BASE_URL = window.location.origin;

    /* ── DARK MODE ───────────────────────────────────────── */
    (function () {
      const saved = localStorage.getItem("hariom_theme");
      const html = document.documentElement;
      if (saved === "light") {
        html.classList.remove("dark");
      } else {
        html.classList.add("dark"); // default: dark
      }
    })();

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById("darkToggleIcon");
      const isDark = html.classList.contains("dark");
      if (isDark) {
        html.classList.remove("dark");
        localStorage.setItem("hariom_theme", "light");
        if (icon) icon.textContent = "light_mode";
      } else {
        html.classList.add("dark");
        localStorage.setItem("hariom_theme", "dark");
        if (icon) icon.textContent = "dark_mode";
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      const icon = document.getElementById("darkToggleIcon");
      if (icon) {
        icon.textContent = document.documentElement.classList.contains("dark") ? "dark_mode" : "light_mode";
      }
    });
    /* ── END DARK MODE ───────────────────────────────────── */

    /* ── SESSION EXPIRED MESSAGE ─────────────────────────── */
    (function () {
      const params = new URLSearchParams(window.location.search);
      if (params.get("reason") === "expired") {
        const msg = document.getElementById("message");
        if (msg) {
          msg.style.color = "#ffb4ab";
          msg.innerText = "⚠ Your session has expired. Please sign in again.";
        }
      }
    })();
    /* ── END SESSION EXPIRED ─────────────────────────────── */

    /* ── LOGIN LOGIC ─────────────────────────────────────── */
    async function login() {
      const email    = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const msg      = document.getElementById("message");

      if (!email || !password) {
        msg.style.color = "#ffb4ab";
        msg.innerText = "Please enter email and password.";
        return;
      }

      msg.style.color = "#adc6ff";
      msg.innerText = "Authenticating…";

      try {
        const res  = await fetch(`${BASE_URL}/admin/login`, {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          msg.style.color = "#ffb4ab";
          msg.innerText = data.error || "Login failed. Access denied.";
          return;
        }

        localStorage.setItem("adminToken", data.token);
        msg.style.color = "#4edea3";
        msg.innerText = "Authentication successful. Redirecting…";
        window.location.href = "admin.html";

      } catch (err) {
        msg.style.color = "#ffb4ab";
        msg.innerText = "Network error. Please try again.";
      }
    }
    /* ── END LOGIN LOGIC ─────────────────────────────────── */

    /* ── ENTER KEY ───────────────────────────────────────── */
    document.addEventListener("keydown", e => {
      if (e.key === "Enter") login();
    });
  </script>
</body>
</html>
