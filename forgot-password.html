<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Hariom Electronics</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.0/firebase-auth-compat.js"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "on-surface-variant": "#c2c6d6", "outline": "#8c909f",
            "surface-dim": "#0b1326", "primary-container": "#4d8eff",
            "error": "#ffb4ab", "on-primary": "#002e6a", "surface": "#0b1326",
            "surface-container-highest": "#2d3449",
            "on-secondary-container": "#aeb9d0", "on-surface": "#dae2fd",
            "secondary": "#bcc7de", "on-error-container": "#ffdad6",
            "surface-container-high": "#222a3d", "error-container": "#93000a",
            "surface-bright": "#31394d", "outline-variant": "#424754",
            "surface-variant": "#2d3449", "primary": "#adc6ff",
            "inverse-surface": "#dae2fd", "inverse-primary": "#005ac2",
            "secondary-container": "#3e495d",
            "surface-container-low": "#131b2e", "tertiary": "#4edea3",
            "background": "#0b1326",
            "surface-container": "#171f33",
          },
          fontFamily: { "headline": ["Inter"], "body": ["Inter"], "label": ["Inter"] },
        },
      },
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; min-height: 100dvh; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .glass-panel {
      background: rgba(11, 19, 38, 0.6);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
    }
    html:not(.dark) body { background: #f0f4ff !important; color: #0b1326 !important; }
    html:not(.dark) .glass-panel {
      background: rgba(255, 255, 255, 0.75) !important;
      border: 1px solid rgba(77, 142, 255, 0.15) !important;
    }
    html:not(.dark) .glass-panel input { background: #f0f4ff !important; color: #0b1326 !important; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col">
  <header class="fixed top-0 w-full bg-[#0b1326]/60 backdrop-blur-xl flex justify-between items-center px-6 py-4 z-50">
    <div class="flex items-center gap-3">
      <span class="material-symbols-outlined text-[#adc6ff]">shield_lock</span>
      <h1 class="font-black uppercase text-xl tracking-tighter text-[#adc6ff]">HARIOM ELECTRONICS</h1>
    </div>
    <button class="p-2 rounded-full hover:opacity-80 transition-opacity" onclick="toggleDarkMode()">
      <span class="material-symbols-outlined text-[#dae2fd]" id="darkToggleIcon">dark_mode</span>
    </button>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-20">
    <div class="w-full max-w-md">
      <div class="text-center mb-10">
        <span class="text-xs font-bold tracking-[0.4em] text-primary uppercase opacity-60">Password Reset</span>
        <h2 class="text-3xl font-extrabold tracking-tighter mt-2">Forgot Password?</h2>
        <p class="text-sm text-on-surface-variant mt-2">Enter your email and we'll send you a reset link.</p>
      </div>

      <div class="glass-panel p-8 md:p-10 rounded-lg">
        <form class="space-y-6" onsubmit="event.preventDefault(); sendReset();">
          <div class="space-y-2">
            <label class="block text-[10px] font-bold tracking-[0.1em] text-on-surface-variant uppercase ml-1" for="resetEmail">Email</label>
            <div class="relative flex items-center bg-surface-container-low rounded-md overflow-hidden">
              <span class="material-symbols-outlined absolute left-4 text-outline">alternate_email</span>
              <input class="w-full bg-transparent border-none py-4 pl-12 pr-4 text-on-surface focus:ring-0"
                id="resetEmail" type="email" placeholder="accountant@example.com" autocomplete="email" required>
            </div>
          </div>
          <div class="text-sm font-medium min-h-[20px] text-center" id="resetMsg"></div>
          <button type="submit"
            class="w-full h-14 bg-gradient-to-br from-primary to-primary-container rounded-md text-on-primary font-bold tracking-tight text-lg shadow-[0_8px_32px_rgba(77,142,255,0.3)] hover:scale-[1.02] active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
            <span>SEND RESET LINK</span>
            <span class="material-symbols-outlined">mail</span>
          </button>
        </form>
        <div class="mt-6 text-center">
          <a href="login.html" class="text-sm text-primary opacity-80 hover:opacity-100 transition-opacity flex items-center justify-center gap-1">
            <span class="material-symbols-outlined text-base">arrow_back</span>
            Back to Login
          </a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBfQlLpHbuRsZ7YKIFBj8Fa5o-HMo0SBrU",
      authDomain: "hariom-delivery.firebaseapp.com",
      projectId: "hariom-delivery",
      storageBucket: "hariom-delivery.firebasestorage.app",
      messagingSenderId: "60300951507",
      appId: "1:60300951507:web:e5d55d0d18dc2000b47926"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    (function() {
      const saved = localStorage.getItem("hariom_theme");
      if (saved === "light") document.documentElement.classList.remove("dark");
    })();

    function toggleDarkMode() {
      const html = document.documentElement;
      const icon = document.getElementById("darkToggleIcon");
      if (html.classList.toggle("dark")) {
        localStorage.setItem("hariom_theme", "dark");
        if (icon) icon.textContent = "dark_mode";
      } else {
        localStorage.setItem("hariom_theme", "light");
        if (icon) icon.textContent = "light_mode";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const icon = document.getElementById("darkToggleIcon");
      if (icon) icon.textContent = document.documentElement.classList.contains("dark") ? "dark_mode" : "light_mode";
    });

    async function sendReset() {
      const email = document.getElementById("resetEmail").value;
      const msg   = document.getElementById("resetMsg");
      const btn   = document.querySelector("button[type=submit]");

      if (!email) { msg.style.color = "#ffb4ab"; msg.innerText = "Please enter your email."; return; }

      msg.style.color = "#adc6ff";
      msg.innerText = "Sending reset link…";
      btn.disabled = true;
      btn.querySelector("span:first-child").textContent = "SENDING…";

      try {
        await auth.sendPasswordResetEmail(email);
        msg.style.color = "#4edea3";
        msg.innerText = "✅ Reset link sent! Check your email (including spam).";
      } catch (err) {
        msg.style.color = "#ffb4ab";
        if (err.code === "auth/user-not-found") msg.innerText = "No account found with this email.";
        else if (err.code === "auth/invalid-email") msg.innerText = "Invalid email address.";
        else if (err.code === "auth/too-many-requests") msg.innerText = "Too many requests. Please wait a few minutes.";
        else msg.innerText = "Error: " + err.message;
      }

      btn.disabled = false;
      btn.querySelector("span:first-child").textContent = "SEND RESET LINK";
    }
  </script>
</body>
</html>
