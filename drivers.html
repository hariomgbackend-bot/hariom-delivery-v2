<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <title>Driver Management — Hariom Traders</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #dde3ed;
      --accent: #2563eb;
      --header-bg: linear-gradient(135deg, #0b1629 0%, #162032 100%);
      --text: #1a2540;
      --muted: #64748b;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }

    body { font-family: var(--font-body); background: var(--bg); color: var(--text); }

    .header {
      background: var(--header-bg);
      color: white;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 4px 20px rgba(0,0,0,0.3);
      position: sticky; top: 0; z-index: 100;
    }

    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-brand-name { font-family: var(--font-display); font-size: 17px; font-weight: 700; color: #e8edf5; }
    .header-brand-tag {
      font-family: var(--font-mono); font-size: 9px; font-weight: 600;
      color: #f59e0b; letter-spacing: 1.5px; text-transform: uppercase;
      background: rgba(245,158,11,0.12); padding: 2px 7px; border-radius: 4px;
      border: 1px solid rgba(245,158,11,0.2);
    }

    .header-nav a {
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 7px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: background 0.2s, color 0.2s;
    }
    .header-nav a:hover { background: rgba(255,255,255,0.08); color: white; }

    .container { max-width: 1000px; margin: 0 auto; padding: 24px 20px; }

    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }

    .card h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin-bottom: 18px; color: var(--text); }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-family: var(--font-mono);
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1px; color: #94a3b8;
    }

    .field input {
      padding: 10px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-family: var(--font-body); font-size: 14px; color: var(--text);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
      background: #f8fafc;
    }
    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: white;
    }
    .field input:disabled { background: #f1f5f9; color: var(--muted); cursor: not-allowed; }

    .search-input {
      width: 100%; padding: 9px 14px;
      border: 1.5px solid var(--border); border-radius: 9px;
      font-family: var(--font-body); font-size: 14px; outline: none;
      margin-bottom: 14px; transition: border-color 0.2s, box-shadow 0.2s;
      background: #f8fafc; color: var(--text);
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
      background: white;
    }

    .btn {
      padding: 10px 20px; border: none; border-radius: 9px;
      font-family: var(--font-body); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger  { background: #dc2626; color: white; }
    .btn-gray    { background: #64748b; color: white; }
    .btn-add { margin-top: 18px; }

    /* TABLE */
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    thead th {
      background: #0b1629; color: rgba(255,255,255,0.65);
      padding: 11px 14px; text-align: left;
      font-family: var(--font-mono); font-weight: 500; font-size: 10px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    /* POPUP */
    .popup-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(8,17,31,0.7); z-index: 200;
      align-items: center; justify-content: center;
      backdrop-filter: blur(4px);
    }
    .popup-overlay.show { display: flex; }

    .popup-card {
      background: white; width: 90%; max-width: 500px;
      border-radius: 18px; padding: 28px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.3);
      max-height: 90vh; overflow-y: auto;
      border: 1px solid var(--border);
    }

    .popup-card h3 { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin-bottom: 20px; }

    .popup-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

    @media (max-width: 600px) { .header { padding: 0 16px; } }
  </style>
</head>
<body>

<div class="header">
  <div class="header-brand">
    <span class="header-brand-name">Hariom Electronics</span>
    <span class="header-brand-tag">DRIVERS</span>
  </div>
  <nav class="header-nav">
    <a href="admin.html">← Dashboard</a>
  </nav>
</div>

<div class="container">

  <div class="card">
    <h3>Add New Driver</h3>
    <div class="form-grid">
      <div class="field"><label>Driver Name *</label><input id="name" placeholder="Full name"></div>
      <div class="field"><label>Phone Number *</label><input id="phone" placeholder="10-digit number" maxlength="10"></div>
      <div class="field"><label>Vehicle Number</label><input id="vehicle_number" placeholder="e.g. MH12AB1234"></div>
      <div class="field"><label>Vehicle Make</label><input id="vehicle_make" placeholder="e.g. Tata"></div>
      <div class="field"><label>Vehicle Model</label><input id="vehicle_model" placeholder="e.g. Ace"></div>
      <div class="field"><label>6-Digit PIN *</label><input id="pin" placeholder="Set login PIN" maxlength="6" type="password"></div>
    </div>
    <button class="btn btn-primary btn-add" onclick="addDriver()">+ Add Driver</button>
  </div>

  <div class="card">
    <h3>Driver List</h3>
    <input
      id="driverSearch"
      class="search-input"
      placeholder="🔍 Search by name or phone…"
      oninput="filterDrivers()">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Vehicle No.</th>
            <th>Make</th>
            <th>Model</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- DRIVER DETAIL POPUP -->
<div class="popup-overlay" id="driverPopup">
  <div class="popup-card">
    <h3>Driver Details</h3>
    <div class="form-grid">
      <div class="field"><label>Driver Name</label><input id="edit_name" disabled></div>
      <div class="field"><label>Phone Number</label><input id="edit_phone" disabled></div>
      <div class="field"><label>Vehicle Number</label><input id="edit_vehicle_number" disabled></div>
      <div class="field"><label>Vehicle Make</label><input id="edit_vehicle_make" disabled></div>
      <div class="field"><label>Vehicle Model</label><input id="edit_vehicle_model" disabled></div>
      <div class="field"><label>New PIN (leave blank to keep)</label><input id="edit_pin" disabled maxlength="6" type="password"></div>
    </div>
    <div class="popup-actions">
      <button class="btn btn-primary" id="editBtn" onclick="enableEdit()">✏ Edit</button>
      <button class="btn btn-success" id="saveBtn" style="display:none;" onclick="saveDriver()">💾 Save</button>
      <button class="btn btn-danger" onclick="deleteDriver()">🗑 Delete</button>
      <button class="btn btn-gray" onclick="closeDriverPopup()">Close</button>
    </div>
  </div>
</div>

<div id="driverToast" style="display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1e293b;color:white;padding:11px 22px;border-radius:100px;font-size:14px;font-weight:500;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.3);white-space:nowrap;transition:opacity 0.3s;"></div>

<script>
const BASE_URL = window.location.origin;
const token = localStorage.getItem("adminToken");
if (!token) window.location.href = "login.html";

let driverCache = [];
let currentDriverId = null;

document.getElementById("phone").addEventListener("input", function () {
  this.value = this.value.replace(/\D/g, "");
});

function showToast(msg, color) {
  const t = document.getElementById("driverToast");
  t.innerText = msg;
  t.style.background = color || "#1e293b";
  t.style.display = "block";
  t.style.opacity = "1";
  setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.style.display = "none", 300); }, 3000);
}

async function addDriver() {
  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const vehicle_number = document.getElementById("vehicle_number").value.trim();
  const vehicle_make = document.getElementById("vehicle_make").value.trim();
  const vehicle_model = document.getElementById("vehicle_model").value.trim();
  const pin = document.getElementById("pin").value.trim();

  if (!name) { showToast("⚠ Driver name required", "#dc2626"); return; }
  if (phone.length !== 10) { showToast("⚠ Phone must be 10 digits", "#dc2626"); return; }
  if (!/^\d{6}$/.test(pin)) { showToast("⚠ PIN must be exactly 6 digits", "#dc2626"); return; }

  const btn = document.querySelector(".btn-add");
  btn.disabled = true; btn.innerText = "Adding…";

  try {
    const res = await fetch(`${BASE_URL}/addDriver`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ driver_name: name, phone, vehicle_number, vehicle_make, vehicle_model, pin })
    });
    const result = await res.json();
    if (!res.ok) { showToast("⚠ " + (result.error || "Failed to add driver"), "#dc2626"); btn.disabled = false; btn.innerText = "+ Add Driver"; return; }
    ["name", "phone", "vehicle_number", "vehicle_make", "vehicle_model", "pin"].forEach(id => { document.getElementById(id).value = ""; });
    showToast("✅ Driver added successfully", "#16a34a");
    loadDrivers();
  } catch (e) {
    showToast("⚠ Network error. Try again.", "#dc2626");
  }
  btn.disabled = false; btn.innerText = "+ Add Driver";
}

async function loadDrivers() {
  const res = await fetch(`${BASE_URL}/drivers`, { headers: { Authorization: "Bearer " + token } });
  const data = await res.json();
  driverCache = data;

  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(d => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${d.driver_name}</td>
      <td>${d.phone || "—"}</td>
      <td>${d.vehicle_number || "—"}</td>
      <td>${d.vehicle_make || "—"}</td>
      <td>${d.vehicle_model || "—"}</td>
      <td><button class="btn btn-primary" style="padding:6px 14px;font-size:12px;" onclick="openDriverPopup('${d.id}')">View</button></td>
    `;
    list.appendChild(tr);
  });
}

function openDriverPopup(id) {
  const d = driverCache.find(x => x.id === id);
  if (!d) return;
  currentDriverId = id;

  document.getElementById("edit_name").value = d.driver_name || "";
  document.getElementById("edit_phone").value = d.phone || "";
  document.getElementById("edit_vehicle_number").value = d.vehicle_number || "";
  document.getElementById("edit_vehicle_make").value = d.vehicle_make || "";
  document.getElementById("edit_vehicle_model").value = d.vehicle_model || "";
  document.getElementById("edit_pin").value = "";

  disableEdit();
  document.getElementById("driverPopup").classList.add("show");
}

function closeDriverPopup() {
  document.getElementById("driverPopup").classList.remove("show");
  disableEdit();
}

function enableEdit() {
  ["edit_name", "edit_phone", "edit_vehicle_number", "edit_vehicle_make", "edit_vehicle_model", "edit_pin"]
    .forEach(id => document.getElementById(id).disabled = false);
  document.getElementById("editBtn").style.display = "none";
  document.getElementById("saveBtn").style.display = "inline-flex";
}

function disableEdit() {
  ["edit_name", "edit_phone", "edit_vehicle_number", "edit_vehicle_make", "edit_vehicle_model", "edit_pin"]
    .forEach(id => document.getElementById(id).disabled = true);
  document.getElementById("editBtn").style.display = "inline-flex";
  document.getElementById("saveBtn").style.display = "none";
}

async function saveDriver() {
  const updated = {
    driver_name: document.getElementById("edit_name").value.trim(),
    phone: document.getElementById("edit_phone").value.trim(),
    vehicle_number: document.getElementById("edit_vehicle_number").value.trim(),
    vehicle_make: document.getElementById("edit_vehicle_make").value.trim(),
    vehicle_model: document.getElementById("edit_vehicle_model").value.trim()
  };

  const newPin = document.getElementById("edit_pin").value.trim();
  if (newPin) {
    if (!/^\d{6}$/.test(newPin)) { showToast("⚠ PIN must be exactly 6 digits", "#dc2626"); return; }
    updated.pin = newPin;
  }

  try {
    const res = await fetch(`${BASE_URL}/driver/${currentDriverId}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify(updated)
    });
    const result = await res.json();
    if (!res.ok) { showToast("⚠ " + (result.error || "Save failed"), "#dc2626"); return; }
    showToast("✅ Driver updated", "#16a34a");
    disableEdit();
    loadDrivers();
  } catch (e) {
    showToast("⚠ Network error. Try again.", "#dc2626");
  }
}

async function deleteDriver() {
  if (!confirm("Are you sure you want to delete this driver?")) return;
  if (prompt("Type DELETE to confirm:") !== "DELETE") return;

  const res = await fetch(`${BASE_URL}/driver/${currentDriverId}`, {
    method: "DELETE",
    headers: { Authorization: "Bearer " + token }
  });

  const result = await res.json();
  if (result.error) { alert(result.error); return; }

  closeDriverPopup();
  loadDrivers();
}

function filterDrivers() {
  const q = document.getElementById("driverSearch").value.toLowerCase();
  document.querySelectorAll("#list tr").forEach(tr => {
    const text = tr.innerText.toLowerCase();
    tr.style.display = q && !text.includes(q) ? "none" : "";
  });
}

loadDrivers();
</script>
</body>
</html>
