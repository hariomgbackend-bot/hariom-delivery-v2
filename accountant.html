<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hariom DMS">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
  <meta name="theme-color" content="#0f172a">
  <title>Accountant Panel — Hariom Traders</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --border: #dde3ed;
      --accent: #2563eb;
      --accent-light: rgba(37,99,235,0.08);
      --header-bg: linear-gradient(135deg, #0b1629 0%, #162032 100%);
      --text: #1a2540;
      --muted: #64748b;
      --font-display: 'Syne', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'DM Sans', sans-serif;
    }

    body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: #08111f;
      z-index: 999;
      align-items: center;
      justify-content: center;
    }
    #loginScreen.active { display: flex; }
    #loginScreen::before {
      content: '';
      position: fixed; inset: 0;
      background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 28px 28px;
      pointer-events: none;
    }

    .login-card {
      background: rgba(22, 32, 48, 0.97);
      border: 1px solid rgba(245,158,11,0.18);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6);
      animation: slideUp 0.45s cubic-bezier(0.16,1,0.3,1) both;
      position: relative;
      z-index: 1;
    }
    @keyframes slideUp {
      from { opacity:0; transform:translateY(20px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .login-brand { text-align: center; margin-bottom: 32px; }
    .login-icon {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      border-radius: 16px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px; margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(245,158,11,0.35);
    }
    .login-brand h2 { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: #e8edf5; }
    .login-brand p  { font-family: var(--font-mono); font-size: 10px; color: #f59e0b; letter-spacing: 2px; text-transform: uppercase; margin-top: 6px; }
    .login-field { margin-bottom: 18px; }
    .login-field label {
      display: flex; align-items: center; gap: 5px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 1.5px;
      color: #6b7f9e; margin-bottom: 8px;
    }
    .login-field label::before { content:''; width:3px; height:3px; background:#f59e0b; border-radius:50%; display:inline-block; }
    .login-field input {
      width: 100%; padding: 12px 14px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 9px; color: #e8edf5;
      font-family: var(--font-body); font-size: 15px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .login-field input:focus {
      border-color: rgba(245,158,11,0.5);
      box-shadow: 0 0 0 3px rgba(245,158,11,0.1);
    }
    .login-field input::placeholder { color: #3d5070; }
    .login-btn {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #08111f; border: none; border-radius: 9px;
      font-family: var(--font-display); font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 6px;
      transition: opacity 0.2s, transform 0.15s;
      box-shadow: 0 6px 24px rgba(245,158,11,0.3);
    }
    .login-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    .login-error { text-align: center; font-family: var(--font-mono); font-size: 11px; color: #f87171; margin-top: 12px; min-height: 18px; letter-spacing: 0.3px; }

    /* ── HEADER ── */
    .header {
      background: var(--header-bg);
      color: white;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      box-shadow: 0 1px 0 rgba(255,255,255,0.04), 0 4px 20px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header-brand {
      display: flex; align-items: center; gap: 10px;
    }
    .header-brand-name {
      font-family: var(--font-display);
      font-size: 17px; font-weight: 700;
      color: #e8edf5;
    }
    .header-brand-tag {
      font-family: var(--font-mono);
      font-size: 9px; font-weight: 600;
      color: #f59e0b; letter-spacing: 1.5px; text-transform: uppercase;
      background: rgba(245,158,11,0.12);
      padding: 2px 7px; border-radius: 4px;
      border: 1px solid rgba(245,158,11,0.2);
    }

    .container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }

    .card {
      background: var(--surface);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid var(--border);
      box-shadow: 0 1px 6px rgba(0,0,0,0.05);
    }
    .card h3 { font-family: var(--font-display); font-size: 17px; font-weight: 700; margin-bottom: 16px; }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border: none; border-radius: 9px;
      font-family: var(--font-body); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s, transform 0.15s;
    }
    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { background: var(--accent); color: white; }
    .btn-success { background: #16a34a; color: white; }
    .btn-danger  { background: #dc2626; color: white; }
    .btn-gray    { background: #64748b; color: white; }
    .btn-sm      { padding: 5px 12px; font-size: 12px; font-weight: 500; }

    /* ── FILTER BAR ── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .filter-btn {
      padding: 6px 13px;
      border: 1.5px solid var(--border); border-radius: 7px;
      background: transparent; color: var(--muted);
      font-family: var(--font-body); font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
    }
    .filter-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(37,99,235,0.04); }
    .filter-btn.activeFilter { background: var(--accent); border-color: var(--accent); color: white; }
    .filter-count {
      display: inline-block; background: rgba(0,0,0,0.12);
      border-radius: 8px; padding: 1px 6px;
      font-family: var(--font-mono); font-size: 10px; font-weight: 700;
      margin-left: 3px; min-width: 16px; text-align: center;
    }
    .filter-btn.activeFilter .filter-count { background: rgba(255,255,255,0.25); }

    .search-input {
      padding: 8px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      font-family: var(--font-body); font-size: 13px; outline: none;
      min-width: 220px; transition: border-color 0.2s; color: var(--text);
    }
    .search-input:focus { border-color: var(--accent); }

    /* ── SUMMARY ── */
    .summary-bar {
      display: flex; gap: 16px; font-size: 13px; font-weight: 600;
      color: var(--muted); margin-bottom: 12px; flex-wrap: wrap;
    }
    .summary-bar span { color: var(--text); }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 700px; }
    thead th {
      background: #0b1629; color: rgba(255,255,255,0.65);
      padding: 11px 14px; text-align: left;
      font-family: var(--font-mono); font-weight: 500; font-size: 10px;
      text-transform: uppercase; letter-spacing: 1px;
    }
    tbody td { padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 9px; border-radius: 6px;
      font-size: 11px; font-weight: 700; text-transform: capitalize;
    }
    .badge-pending   { background: rgba(245,158,11,0.12); color: #b45309; }
    .badge-loaded    { background: rgba(56,189,248,0.12);  color: #0369a1; }
    .badge-delivered { background: rgba(74,222,128,0.12);  color: #166534; }
    .badge-failed    { background: rgba(248,113,113,0.12); color: #b91c1c; }

    /* ── POPUP ── */
    .popup-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(8,17,31,0.7); z-index: 200;
      backdrop-filter: blur(4px);
      overflow-y: auto; padding: 30px 16px;
      align-items: flex-end; /* used on mobile */
    }
    .popup-overlay.is-open { display: flex; }

    /* PC: center the popup */
    @media (min-width: 768px) {
      .popup-overlay.is-open { align-items: flex-start; justify-content: center; }
      .popup-overlay.is-open .popup-card { margin-top: 40px; }
    }

    .popup-card {
      background: white; width: 100%; max-width: 520px; margin: 0 auto;
      border-radius: 18px; padding: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.2); max-height: 88vh; overflow-y: auto;
    }

    /* Mobile: full-width bottom sheet */
    @media (max-width: 767px) {
      .popup-card {
        border-radius: 22px 22px 0 0;
        max-width: 100%;
        margin: 0;
        max-height: 92vh;
        padding: 22px 18px 30px;
      }
    }

    .popup-card h3 { font-family: 'DM Serif Display', serif; font-size: 20px; margin-bottom: 20px; }

    /* ── FORM FIELDS ── */
    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.7px;
      color: var(--muted); margin-top: 16px; margin-bottom: 6px;
    }
    .popup-card input,
    .popup-card select {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 9px;
      font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text);
      outline: none; margin-bottom: 8px; background: #fafbfc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .popup-card input:focus,
    .popup-card select:focus {
      border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); background: white;
    }
    .checkbox-row {
      display: flex; align-items: center; gap: 8px; margin: 12px 0 6px;
      font-weight: 500; font-size: 14px;
    }
    .checkbox-row input[type="checkbox"] { width: auto; margin-bottom: 0; }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }

    /* ── DETAIL ROWS (view popup) ── */
    .detail-row {
      display: flex; gap: 10px; padding: 9px 0;
      border-bottom: 1px solid var(--border); font-size: 14px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row b { color: var(--muted); min-width: 130px; font-weight: 500; font-size: 13px; }

    /* ── BATCH ROW GROUPING ── */
    tbody tr.batch-first td { border-top: 2px solid var(--batch-color, #a78bfa); padding-top: 14px; }
    tbody tr.batch-first td:first-child { border-left: 3px solid var(--batch-color, #a78bfa); border-radius: 0; }
    tbody tr.batch-mid   td:first-child { border-left: 3px solid var(--batch-color, #a78bfa); }
    tbody tr.batch-last  td:first-child { border-left: 3px solid var(--batch-color, #a78bfa); }
    tbody tr.batch-last  td { border-bottom: 2px solid var(--batch-color, #a78bfa) !important; padding-bottom: 14px; }
    tbody tr.batch-row   td { background: var(--batch-bg, #f5f3ff) !important; }
    tbody tr.batch-row:hover td { filter: brightness(0.97); }
    tbody tr.batch-row + tr:not(.batch-row) { border-top: 8px solid transparent; }

    /* ══ PHONE LINK ══ */
    .phone-link { color: var(--accent); text-decoration: none; font-weight: 600; }
    .phone-link:hover { text-decoration: underline; }

    /* ══ LAST-UPDATED ══ */
    #lastUpdated { font-size: 11px; color: rgba(255,255,255,0.45); }

    /* ══ MOBILE (≤ 767px) ══ */
    @media (max-width: 767px) {
      .header { padding: 0 14px; height: 56px; }
      .header-brand { font-size: 17px; }
      .container { padding: 12px; }
      .card { padding: 14px; border-radius: 14px; }
      .card h3 { font-size: 16px; margin-bottom: 12px; }

      /* Hide desktop table; show mobile cards */
      .table-wrap { display: none !important; }
      .summary-bar { font-size: 12px; gap: 10px; }

      /* Mobile delivery cards container */
      .mobile-cards { display: block; }

      /* Individual delivery card */
      .delivery-mob-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 10px;
        box-shadow: 0 1px 6px rgba(0,0,0,0.05);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.15s;
        active-opacity: 0.85;
      }
      .delivery-mob-card:active { opacity: 0.85; }

      /* Batch left-border accent */
      .delivery-mob-card.batch-card {
        border-left: 3px solid var(--mob-batch-color, #7c3aed);
      }

      .mob-card-header {
        display: flex; align-items: flex-start;
        justify-content: space-between; gap: 8px; margin-bottom: 6px;
      }
      .mob-card-name { font-size: 15px; font-weight: 700; line-height: 1.3; }
      .mob-card-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
      .mob-card-meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

      /* Filter bar: horizontal scroll, no wrap */
      .filter-bar { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .filter-bar::-webkit-scrollbar { display: none; }
      .filter-btn { flex-shrink: 0; }
      .search-input { min-width: 100%; }

      /* Form actions stacked on mobile */
      .form-actions { flex-direction: column; }
      .form-actions .btn { width: 100%; justify-content: center; }

      /* Batch group container */
      .mob-batch-group { margin-bottom: 12px; }
      .mob-batch-group-header {
        display: flex; align-items: center; gap: 7px;
        padding: 7px 12px; font-size: 11px; font-weight: 700;
        text-transform: uppercase; letter-spacing: 0.5px;
        border-radius: 11px 11px 0 0;
        background: var(--mob-batch-bg, #f5f3ff);
        color: var(--mob-batch-text, #5b21b6);
        border: 2px solid var(--mob-batch-color, #7c3aed);
        border-bottom: none;
      }
      .mob-batch-group .delivery-mob-card {
        border-radius: 0;
        border: 2px solid var(--mob-batch-color, #7c3aed);
        border-top: none;
        margin-bottom: 0;
        background: var(--mob-batch-bg, #f5f3ff);
      }
      .mob-batch-group .delivery-mob-card:last-child {
        border-radius: 0 0 11px 11px;
      }
    }

    /* ══ PC (≥ 768px) ══ */
    @media (min-width: 768px) {
      .mobile-cards { display: none; }
    }

    /* ══ LARGE (≥ 1200px) ══ */
    @media (min-width: 1200px) {
      .container { padding: 28px 32px; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══ -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <div class="login-icon">🧾</div>
      <h2>Hariom Electronics</h2>
      <p>Accountant Panel</p>
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="login-btn" onclick="doAccountantLogin()">Sign In →</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="appShell" style="display:none;">

<div class="header">
  <div class="header-brand">
    <img src="/icons/icon-72x72.png" style="width:30px;height:30px;border-radius:7px;object-fit:contain;background:rgba(255,255,255,0.08);" onerror="this.style.display='none'" alt="Logo">
    <span class="header-brand-name">Hariom Electronics</span>
    <span class="header-brand-tag">ACCOUNTS</span>
  </div>
  <nav style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
    <span id="lastUpdated" style="font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.5px;"></span>
    <span id="pushIndicator" style="font-size:12px;color:rgba(255,255,255,0.4);"></span>
    <a href="driver_interface.html" style="color:rgba(255,255,255,0.65);text-decoration:none;font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;border:1px solid rgba(255,255,255,0.1);transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.08)'" onmouseout="this.style.background='none'">🚚 Driver View</a>
    <button onclick="accountantLogout()" style="background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.65);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:6px 12px;border-radius:7px;cursor:pointer;transition:all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.14)'" onmouseout="this.style.background='rgba(255,255,255,0.08)'">Logout</button>
  </nav>
</div>

<div class="container">

  <div class="card" style="padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
    <button class="btn btn-primary" onclick="openPopup()">+ Create Delivery</button>
    <button class="btn btn-success" onclick="exportToCSV()">⬇ Export CSV</button>
  </div>

  <div class="card">
    <h3>Deliveries</h3>

    <div class="filter-bar">
      <button class="filter-btn" data-filter="all"       onclick="setFilter('all')">All <span class="filter-count" id="fc-all"></span></button>
      <button class="filter-btn" data-filter="pending"   onclick="setFilter('pending')">Pending <span class="filter-count" id="fc-pending"></span></button>
      <button class="filter-btn" data-filter="loaded"    onclick="setFilter('loaded')">Loaded <span class="filter-count" id="fc-loaded"></span></button>
      <button class="filter-btn" data-filter="delivered" onclick="setFilter('delivered')">Delivered <span class="filter-count" id="fc-delivered"></span></button>
      <button class="filter-btn" data-filter="failed"    onclick="setFilter('failed')" style="color:#dc2626;border-color:#fca5a5;">❌ Failed <span class="filter-count" id="fc-failed"></span></button>
      <button class="filter-btn" data-filter="urgent"    onclick="setFilter('urgent')">🔥 Urgent <span class="filter-count" id="fc-urgent"></span></button>
      <button class="filter-btn" data-filter="today"     onclick="setFilter('today')">Today <span class="filter-count" id="fc-today"></span></button>
      <button class="filter-btn" data-filter="yesterday" onclick="setFilter('yesterday')">Yesterday</button>
      <button class="filter-btn" data-filter="custom"    onclick="showCustomDate()">📅 Custom</button>
      <input type="date" id="customDate" style="display:none;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:13px;" onchange="applyCustomDate()">
    </div>

    <input class="search-input" id="searchInput" placeholder="🔍 Search by name or phone..." oninput="applySearch()" style="margin-bottom:14px;">

    <div class="summary-bar" id="deliverySummary"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Phone</th>
            <th>Product</th>
            <th>Driver</th>
            <th>ETA</th>
            <th>Status</th>
            <th>Rating</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <div class="mobile-cards" id="mobileCards"></div>
  </div>

</div>

<!-- CREATE DELIVERY POPUP -->
<div class="popup-overlay" id="popup">
  <div class="popup-card">
    <h3>Create Delivery</h3>
    <div id="formMessage" style="margin-bottom:10px;font-size:14px;font-weight:500;"></div>

    <div class="section-title">Customer Name</div>
    <input id="first_name" placeholder="First Name">
    <input id="middle_name" placeholder="Middle Name (Optional)">
    <input id="last_name" placeholder="Last Name">

    <div class="section-title">Phone</div>
    <input id="phone" placeholder="Phone" maxlength="10">
    <input id="alt_phone" placeholder="Alternate Phone (Optional)" maxlength="10">

    <div class="section-title">Address</div>

    <!-- PIN CODE — first, triggers auto-fill -->
    <div style="position:relative;">
      <input id="pincode" placeholder="PIN Code" maxlength="6"
             style="padding-right:36px;"
             inputmode="numeric">
      <span id="pinSpinner" style="display:none;position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:14px;">⏳</span>
    </div>

// Central handler — called any time a 401 is received
function handleAuthError() {
  localStorage.removeItem("accountantToken");

  setTimeout(() => {
    document.getElementById("loginError").innerText = "⚠ Session expired. Please log in again.";

}

// Decode JWT exp claim without verifying signature (safe — we just read the expiry time)
function isTokenExpired() {
  const t = localStorage.getItem("accountantToken");
  if (!t) return true;
  try {
    const payload = JSON.parse(atob(t.split(".")[1]));
    return Date.now() >= payload.exp * 1000;
  } catch { return true; }
}

// Check on every visibility change (user switches back to tab)
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && isTokenExpired()) {
    handleAuthError();
  }
});

function showLoginScreen() {
  document.getElementById("loginScreen").classList.add("active");

async function doAccountantLogin() {

    body: JSON.stringify({ password })
  });
  const data = await res.json();
  if (!res.ok) { err.innerText = data.error || "Invalid password"; return; }

  localStorage.setItem("accountantToken", data.token);
  showApp();
  initApp();
}

async function initSWAndPush() {
  if (!("serviceWorker" in navigator)) return;
  try {
    const regs = await navigator.serviceWorker.getRegistrations();
    for (const r of regs) {
      if (r.active && !r.active.scriptURL.includes("firebase-messaging-sw")) await r.unregister();
    }
    const reg = await navigator.serviceWorker.register("/firebase-messaging-sw.js", { scope: "/" });
    // Wait for SW to activate
    await new Promise(resolve => {
      if (reg.active) { resolve(); return; }
      const sw = reg.installing || reg.waiting;
      if (!sw) { resolve(); return; }
      sw.addEventListener("statechange", function h() {
        if (sw.state === "activated") { sw.removeEventListener("statechange", h); resolve(); }
      });
    });
    swRegistration = reg;
    await registerAccountantPush(reg);
  } catch (e) { console.warn("[SW] Init failed:", e); }
}

async function registerAccountantPush(reg, isRetry = false) {
  const indicator = document.getElementById("pushIndicator");
  if (!("Notification" in window)) return;
  const perm = await Notification.requestPermission();
  if (perm !== "granted") { if (indicator) indicator.innerText = "🔕 Notifications blocked"; return; }
  try {
    const registration = reg || swRegistration || await navigator.serviceWorker.ready;
    const token = await messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration });
    if (!token) return;
    await fetch(`${BASE_URL}/saveAccountantPushToken`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token })
    });
    if (indicator) indicator.innerText = "🔔 Notifications on";
  } catch (err) {
    console.warn("[Push]", err);
    if (!isRetry && err.message?.includes("registration")) {
      try { await messaging.deleteToken(); setTimeout(() => registerAccountantPush(null, true), 2500); } catch (_) {}
    } else {
      if (indicator) indicator.innerText = "⚠ Push unavailable";
    }
  }
}

messaging.onMessage(async payload => {
  try {
    const reg = swRegistration || await navigator.serviceWorker.ready;
    reg.showNotification(payload?.data?.title || "Hariom DMS", {
      body: payload?.data?.body || "",
      icon: "/icons/icon-192.png",
      requireInteraction: true
    });

  let n = 0;
  const fi = setInterval(() => {
    document.title = n % 2 === 0 ? "🔔 " + (payload?.data?.title || "Alert") : origTitle;
    if (++n >= 10) { clearInterval(fi); document.title = origTitle; }
  }, 600);

  // Soft beep
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
  } catch (_) {}

  if (typeof loadDeliveries === "function") loadDeliveries();
});

/* ── PIN CODE AUTO-FILL ── */
document.addEventListener("DOMContentLoaded", () => {
  const pincodeEl   = document.getElementById("pincode");
  const stateEl     = document.getElementById("state_field");
  const cityEl      = document.getElementById("city");
  const areaSelect  = document.getElementById("area");
  const areaManual  = document.getElementById("area_manual");
  const pinSpinner  = document.getElementById("pinSpinner");
  const pinError    = document.getElementById("pinError");
  const editStateBtn = document.getElementById("editStateBtn");
  const editCityBtn  = document.getElementById("editCityBtn");

  if (!pincodeEl) return;

  // Digits only
  pincodeEl.addEventListener("input", async () => {
    pincodeEl.value = pincodeEl.value.replace(/\D/g, "");

    // Reset fields when user is typing
    if (pincodeEl.value.length < 6) {
      resetPinFields();
      return;
    }

    // Fire on exactly 6 digits
    if (pincodeEl.value.length === 6) {
      await fetchPinData(pincodeEl.value);
    }
  });

  function resetPinFields() {
    stateEl.value = ""; stateEl.readOnly = true; stateEl.style.background = "";
    cityEl.value  = ""; cityEl.readOnly  = true; cityEl.style.background  = "";
    editStateBtn.style.display = "none";
    editCityBtn.style.display  = "none";
    areaSelect.style.display   = "none";
    areaSelect.innerHTML       = "";
    areaManual.style.display   = "none";
    areaManual.value           = "";
    pinError.style.display     = "none";
    pinError.innerText         = "";
  }

  async function fetchPinData(pin) {
    pinSpinner.style.display = "inline";
    pinError.style.display   = "none";
    try {
      const res  = await fetch(`https://api.postalpincode.in/pincode/${pin}`);
      const data = await res.json();

      if (data[0].Status === "Success") {
        const offices = data[0].PostOffice;
        const po      = offices[0];

        // Fill state + city — read-only with edit button
        stateEl.value = po.State;
        cityEl.value  = po.District;
        stateEl.readOnly = true; stateEl.style.background = "#f0fdf4";
        cityEl.readOnly  = true; cityEl.style.background  = "#f0fdf4";
        editStateBtn.style.display = "inline-block";
        editCityBtn.style.display  = "inline-block";

        // Populate area dropdown with all post office names
        areaSelect.innerHTML = '<option value="">— Select Area —</option>';
        offices.forEach(office => {
          const opt = document.createElement("option");
          opt.value = office.Name;
          opt.text  = office.Name;
          areaSelect.appendChild(opt);
        });
        areaSelect.style.display  = "block";
        areaManual.style.display  = "none";
        areaManual.value          = "";

      } else {
        pinError.innerText     = "⚠ Invalid PIN Code — please check and re-enter";
        pinError.style.display = "block";
        resetPinFields();
        pincodeEl.focus();
      }
    } catch (err) {
      pinError.innerText     = "⚠ Could not reach PIN API — enter area manually";
      pinError.style.display = "block";
      // Fallback: show manual area input
      areaManual.style.display = "block";
      areaSelect.style.display = "none";
      console.warn("PIN API Error:", err);
    } finally {
      pinSpinner.style.display = "none";
    }
  }

  // Edit override buttons
  editStateBtn.addEventListener("click", () => {
    stateEl.readOnly = false; stateEl.style.background = "";
    stateEl.focus(); editStateBtn.style.display = "none";
  });
  editCityBtn.addEventListener("click", () => {
    cityEl.readOnly = false; cityEl.style.background = "";
    cityEl.focus(); editCityBtn.style.display = "none";
  });
});

/* ── CREATE DELIVERY ── */
async function createDelivery() {
  const btn = document.getElementById("createBtn");
  if (btn.disabled) return;
  btn.disabled = true;
  btn.innerText = "Creating...";

  const firstNameEl     = document.getElementById("first_name");
  const phoneEl         = document.getElementById("phone");
  const addr1El         = document.getElementById("addr1");
  const driverEl        = document.getElementById("driver");
  const etaEl           = document.getElementById("estimated_time");

  if (!firstNameEl.value.trim()) {
    alert("First name is required");
    btn.disabled = false; btn.innerText = "Create Delivery"; return;
  }
  if (!phoneEl.value || phoneEl.value.length !== 10) {
    alert("Valid 10-digit phone number is required");
    btn.disabled = false; btn.innerText = "Create Delivery"; return;
  }
  if (!addr1El.value.trim()) {
    alert("Address Line 1 is required");
    btn.disabled = false; btn.innerText = "Create Delivery"; return;
  }
  if (!driverEl.value) {
    alert("Please assign a driver");
    btn.disabled = false; btn.innerText = "Create Delivery"; return;
  }
  if (!etaEl.value) {
    alert("Estimated delivery time is required");
    btn.disabled = false; btn.innerText = "Create Delivery"; return;
  }
  if (new Date(etaEl.value) < new Date()) {
    alert("Estimated delivery time cannot be in the past");
    btn.disabled = false; btn.innerText = "Create Delivery"; return;
  }

  async function resolveValue(type) {
    const select = document.getElementById(type + "_select");
    const input  = document.getElementById("new_" + type);
    if (select.value === "add_new") {
      const newValue = input.value.trim();
      if (!newValue) { alert("Please enter " + type + " name."); throw new Error("Missing " + type); }
      await fetch(`${BASE_URL}/${type}s`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: newValue })
      });
      return newValue;
    }
    return select.value;
  }

  let productVal, makeVal, modelVal;
  try {
    productVal = await resolveValue("product");
    makeVal    = await resolveValue("make");
    modelVal   = await resolveValue("model");
  } catch { btn.disabled = false; btn.innerText = "Create Delivery"; return; }

  const middleName  = document.getElementById("middle_name").value;
  const lastName    = document.getElementById("last_name").value;
  const fullName    = [firstNameEl.value, middleName, lastName].filter(x => x).join(" ");

  const addr2       = document.getElementById("addr2").value;
  const areaSelect  = document.getElementById("area");
  const areaManual  = document.getElementById("area_manual");
  const area        = areaSelect.style.display !== "none" ? areaSelect.value : areaManual.value;
  const city        = document.getElementById("city").value;
  const stateVal    = document.getElementById("state_field").value;
  const pincodeVal  = document.getElementById("pincode").value;
  // Pincode always at end of address string
  const fullAddress = [addr1El.value, addr2, area, city, stateVal + (pincodeVal ? " - " + pincodeVal : "")].filter(x => x).join(", ");

  const finalProduct     = [productVal, makeVal, modelVal].filter(x => x).join(" ");
  const driverSel        = document.getElementById("driver");
  const hasInstruction   = document.getElementById("has_instruction").checked;
  const freightCharged   = document.getElementById("freight_charged").checked;

  const response = await fetch(`${BASE_URL}/createDelivery`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      customer_name:           capitalizeWords(fullName),
      phone:                   phoneEl.value,
      alternate_phone:         document.getElementById("alt_phone").value || "",
      address:                 capitalizeWords(fullAddress),
      product_name:            capitalizeWords(finalProduct),
      product_serial_number:   document.getElementById("serial").value,
      invoice_number:          document.getElementById("invoice").value,
      priority:                document.getElementById("priority").value,
      estimated_delivery_time: etaEl.value,
      assigned_driver_id:      driverSel.value,
      assigned_driver_name:    driverSel.options[driverSel.selectedIndex].text,
      driver_instructions:     hasInstruction ? document.getElementById("instruction").value.trim() : "none",
      freight_charged:         freightCharged,
      freight_amount:          freightCharged ? document.getElementById("freight_amount").value : ""
    })
  });

  if (!response.ok) {
    const err = await response.json();
    alert(err.error || "Something went wrong. Delivery not created.");
    btn.disabled = false; btn.innerText = "Create Delivery"; return;
  }

  closePopup();
  loadDeliveries();
  resetForm();
  localStorage.removeItem("deliveryDraft");
  document.getElementById("formMessage").innerHTML = "<span style='color:#16a34a;'>✔ Delivery Created Successfully</span>";
  btn.innerText = "Created ✔";
  setTimeout(() => { btn.disabled = false; btn.innerText = "Create Delivery"; }, 1000);
}

/* ── RESET FORM ── */
function resetForm() {
  document.querySelectorAll("#popup input").forEach(i => { i.value = ""; i.classList.remove("error"); });
  document.querySelectorAll("#popup select").forEach(s => { s.selectedIndex = 0; });
  ["product", "make", "model"].forEach(type => {
    const input = document.getElementById("new_" + type);
    const btn   = document.getElementById("btn_" + type);
    if (input) input.style.display = "none";
    if (btn)   btn.style.display = "none";
  });
  document.getElementById("has_instruction").checked = false;
  document.getElementById("instruction").style.display = "none";
  document.getElementById("instruction").value = "";
  document.getElementById("freight_charged").checked = false;
  document.getElementById("freight_amount").style.display = "none";
  document.getElementById("freight_amount").value = "";
  const cityEl  = document.getElementById("city");
  const stateEl = document.getElementById("state_field");
  if (cityEl)  { cityEl.style.background = ""; cityEl.readOnly = true; }
  if (stateEl) { stateEl.style.background = ""; stateEl.readOnly = true; }
  // Reset area dropdown + manual fallback
  const areaSelect = document.getElementById("area");
  const areaManual = document.getElementById("area_manual");
  if (areaSelect) { areaSelect.innerHTML = ""; areaSelect.style.display = "none"; }
  if (areaManual) { areaManual.value = ""; areaManual.style.display = "none"; }
  const editStateBtn = document.getElementById("editStateBtn");
  const editCityBtn  = document.getElementById("editCityBtn");
  if (editStateBtn) editStateBtn.style.display = "none";
  if (editCityBtn)  editCityBtn.style.display  = "none";
  const pinError = document.getElementById("pinError");
  if (pinError) { pinError.style.display = "none"; pinError.innerText = ""; }
  document.getElementById("formMessage").innerHTML = "";
}

/* ── DRAFT AUTO-SAVE ── */
function saveDraft() {
  const fn = document.getElementById("first_name");
  const ph = document.getElementById("phone");
  const a1 = document.getElementById("addr1");
  localStorage.setItem("deliveryDraft", JSON.stringify({
    first_name: fn ? fn.value : "",
    phone:      ph ? ph.value : "",
    addr1:      a1 ? a1.value : ""
  }));
}

function loadDraft() {
  try {
    const draft = JSON.parse(localStorage.getItem("deliveryDraft"));
    if (!draft) return;
    const fn = document.getElementById("first_name");
    const ph = document.getElementById("phone");
    const a1 = document.getElementById("addr1");
    if (fn) fn.value = draft.first_name || "";
    if (ph) ph.value = draft.phone      || "";
    if (a1) a1.value = draft.addr1      || "";
  } catch (_) {}
}

/* ── DATE FORMAT ── */
function formatDate(dateString) {
  if (!dateString) return "—";
  const d = new Date(dateString);
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

/* ── LOAD DELIVERIES ── */
async function loadDeliveries() {
  if (isTokenExpired()) { handleAuthError(); return; }
  let data;
  try {
    const res = await fetch(`${BASE_URL}/deliveries`, {
      headers: { Authorization: "Bearer " + localStorage.getItem("accountantToken") }
    });
    if (res.status === 401) { handleAuthError(); return; }
    data = await res.json();
  } catch (e) { return; }

  const today    = new Date();
  const todayStr = today.toDateString();
  const yest     = new Date(); yest.setDate(today.getDate() - 1);
  const yestStr  = yest.toDateString();

  let finalData = [];

  if (currentFilter === "custom" && customSelectedDate) {
    const selStr = new Date(customSelectedDate).toDateString();
    finalData = data.filter(d => d.created_timestamp && new Date(d.created_timestamp.seconds * 1000).toDateString() === selStr);
  } else if (currentFilter === "yesterday") {
    finalData = data.filter(d => d.created_timestamp && new Date(d.created_timestamp.seconds * 1000).toDateString() === yestStr);
  } else {
    const pendingArr = data.filter(d => d.status === "pending")
      .sort((a, b) => (b.created_timestamp?.seconds || 0) - (a.created_timestamp?.seconds || 0));
    const loadedArr  = data.filter(d => d.status === "loaded");
    const failedArr  = data.filter(d => d.status === "failed");
    const deliveredTodayArr = data.filter(d =>
      d.status === "delivered" && d.delivered_timestamp &&
      new Date(d.delivered_timestamp.seconds * 1000).toDateString() === todayStr
    );
    finalData = [...pendingArr, ...loadedArr, ...failedArr, ...deliveredTodayArr];

    if      (currentFilter === "pending")   finalData = pendingArr;
    else if (currentFilter === "loaded")    finalData = loadedArr;
    else if (currentFilter === "failed")    finalData = failedArr;
    else if (currentFilter === "delivered") finalData = deliveredTodayArr;
    else if (currentFilter === "urgent")    finalData = finalData.filter(d => d.priority === "urgent");
    else if (currentFilter === "today")     finalData = finalData.filter(d =>
      d.created_timestamp && new Date(d.created_timestamp.seconds * 1000).toDateString() === todayStr
    );
  }

  if (searchQuery) {
    finalData = finalData.filter(d =>
      (d.customer_name && d.customer_name.toLowerCase().includes(searchQuery)) ||
      (d.phone && d.phone.includes(searchQuery))
    );
  }

  currentAccountantData = finalData;

  // Update filter count badges (based on all unfiltered data)
  const counts = { all: data.length, pending: 0, loaded: 0, delivered: 0, failed: 0, urgent: 0, today: 0 };
  data.forEach(d => {
    if (d.status === "pending")   counts.pending++;
    if (d.status === "loaded")    counts.loaded++;
    if (d.status === "delivered") counts.delivered++;
    if (d.status === "failed")    counts.failed++;
    if (d.priority === "urgent")  counts.urgent++;
    if (d.created_timestamp && new Date(d.created_timestamp.seconds * 1000).toDateString() === todayStr) counts.today++;
  });
  ["all","pending","loaded","delivered","failed","urgent","today"].forEach(k => {
    const el = document.getElementById("fc-" + k);
    if (el) el.innerText = counts[k] || "";
  });

  // Update page tab title with pending count
  const pendingCount = counts.pending;
  document.title = pendingCount > 0
    ? `(${pendingCount}) Accountant Panel — Hariom Traders`
    : "Accountant Panel — Hariom Traders";

  // ── BATCH GROUPING (module-scope vars updated here) ──
  phoneCounts    = {};
  data.forEach(d => { if (d.phone) phoneCounts[d.phone] = (phoneCounts[d.phone] || 0) + 1; });
  batchPhones    = Object.keys(phoneCounts).filter(p => phoneCounts[p] > 1);
  batchNumberMap = {};
  let batchCounter = 1;
  data.forEach(d => {
    if (d.phone && batchPhones.includes(d.phone) && !(d.phone in batchNumberMap)) {
      batchNumberMap[d.phone] = batchCounter++;
    }
  });

  const BATCH_PALETTES = [
    { bg: "#f5f3ff", border: "#7c3aed", text: "#5b21b6" },
    { bg: "#fdf2f8", border: "#db2777", text: "#9d174d" },
    { bg: "#fff7ed", border: "#ea580c", text: "#9a3412" },
    { bg: "#f0fdf4", border: "#16a34a", text: "#065f46" },
    { bg: "#eff6ff", border: "#2563eb", text: "#1e3a8a" },
    { bg: "#fefce8", border: "#ca8a04", text: "#713f12" },
  ];

  function getDeliveryRating(d) {
    if (d.status !== "delivered" || !d.delivered_timestamp || !d.estimated_delivery_time) return "";
    const deliveredMs = new Date(d.delivered_timestamp.seconds * 1000).getTime();
    const etaMs       = new Date(d.estimated_delivery_time).getTime();
    const diffMin     = (deliveredMs - etaMs) / 60000;
    if (diffMin <= -10) return `<span style="display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;background:#d1fae5;color:#065f46;">⚡ Early</span>`;
    if (diffMin <=  10) return `<span style="display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;background:#dbeafe;color:#1e40af;">✅ On Time</span>`;
    if (diffMin <=  30) return `<span style="display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;background:#fef3c7;color:#92400e;">🕐 Late</span>`;
    return `<span style="display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700;background:#fee2e2;color:#991b1b;">🔴 Very Late</span>`;
  }

  let pending = 0, loaded = 0, delivered = 0, failed = 0;
  const list = document.getElementById("list");
  list.innerHTML = "";

  // Group finalData by phone to know positions (first/mid/last in batch)
  const phonePositions = {};
  finalData.forEach((d, i) => {
    if (d.phone && batchPhones.includes(d.phone)) {
      if (!phonePositions[d.phone]) phonePositions[d.phone] = [];
      phonePositions[d.phone].push(i);
    }
  });

  finalData.forEach((d, i) => {
    if (d.status === "pending")   pending++;
    if (d.status === "loaded")    loaded++;
    if (d.status === "delivered") delivered++;
    if (d.status === "failed")    failed++;

    const tr = document.createElement("tr");
    const isBatched = d.phone && batchPhones.includes(d.phone);

    let batchTag = "";
    let batchStyle = "";

    if (isBatched) {
      const bNum    = batchNumberMap[d.phone];
      const palette = BATCH_PALETTES[(bNum - 1) % BATCH_PALETTES.length];
      const positions = phonePositions[d.phone];
      const posIdx    = positions.indexOf(i);
      const isFirst   = posIdx === 0;
      const isLast    = posIdx === positions.length - 1;

      tr.classList.add("batch-row");
      if (isFirst) tr.classList.add("batch-first");
      if (isLast)  tr.classList.add("batch-last");
      if (!isFirst && !isLast) tr.classList.add("batch-mid");

      tr.style.setProperty("--batch-color", palette.border);
      tr.style.setProperty("--batch-bg",    palette.bg);

      batchTag = `<span style="display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:${palette.bg};color:${palette.text};border:1px solid ${palette.border};vertical-align:middle;white-space:nowrap;">🔗 Batch ${bNum}</span>`;
    }

    if (d.status === "failed") tr.style.background = "#fff1f2";

    tr.innerHTML = `
      <td>${d.customer_name}${batchTag}${d.previous_failures > 0 ? ` <span style="display:inline-block;margin-left:4px;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:#fee2e2;color:#991b1b;">⚠ Prev. Failed</span>` : ""}</td>
      <td><a class='phone-link' href='tel:${d.phone}'>${d.phone}</a></td>
      <td>${d.product_name}</td>
      <td>${d.assigned_driver_name || "—"}</td>
      <td style="font-weight:500;white-space:nowrap;">${formatDate(d.estimated_delivery_time)}</td>
      <td>
        <span class="badge badge-${d.status}">${d.status}</span>
        ${d.status === "failed" && d.failure_reason ? `<div style="font-size:11px;color:#dc2626;margin-top:3px;">${d.failure_reason}</div>` : ""}
      </td>
      <td>${getDeliveryRating(d)}</td>
      <td><button class="btn ${d.status === 'failed' ? 'btn-danger' : 'btn-primary'} btn-sm" onclick="openViewPopup('${d.id}')">${d.status === "failed" ? "⚠ Action" : "View"}</button></td>
    `;
    list.appendChild(tr);
  });

  document.getElementById("deliverySummary").innerHTML = `
    📦 Pending: <span>${pending}</span> &nbsp;|&nbsp;
    🚚 Loaded: <span>${loaded}</span> &nbsp;|&nbsp;
    ✅ Delivered: <span>${delivered}</span>
    ${failed > 0 ? ` &nbsp;|&nbsp; <span style="color:#dc2626;font-weight:700;">❌ Failed: ${failed}</span>` : ""}
  `;

  // Last updated
  const luEl = document.getElementById("lastUpdated");
  if (luEl) luEl.innerText = "🕐 " + new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});

  // Mobile cards
  renderMobileCards(finalData, batchPhones, batchNumberMap, BATCH_PALETTES);
}

/* ── MOBILE CARD RENDER ── */
function renderMobileCards(finalData, batchPhones, batchNumberMap, BATCH_PALETTES) {
  const container = document.getElementById("mobileCards");
  if (!container) return;
  container.innerHTML = "";

  function ratingBadge(d) {
    if (d.status !== "delivered" || !d.delivered_timestamp || !d.estimated_delivery_time) return "";
    const diff = (new Date(d.delivered_timestamp.seconds * 1000) - new Date(d.estimated_delivery_time)) / 60000;
    if (diff <= -10) return `<span style="padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;background:#d1fae5;color:#065f46;">⚡ Early</span>`;
    if (diff <=  10) return `<span style="padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;background:#dbeafe;color:#1e40af;">✅ On Time</span>`;
    if (diff <=  30) return `<span style="padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;background:#fef3c7;color:#92400e;">🕐 Late</span>`;
    return `<span style="padding:2px 7px;border-radius:8px;font-size:10px;font-weight:700;background:#fee2e2;color:#991b1b;">🔴 VLate</span>`;
  }

  function makeMobCard(d, palette) {
    const card = document.createElement("div");
    card.className = "delivery-mob-card" + (palette ? " batch-card" : "");
    if (palette) card.style.setProperty("--mob-batch-color", palette.border);
    card.onclick = () => openViewPopup(d.id);
    card.innerHTML = `
      <div class="mob-card-header">
        <div>
          <div class="mob-card-name">${d.customer_name}${palette ? `<span style="margin-left:6px;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:700;background:${palette.bg};color:${palette.text};border:1px solid ${palette.border};">🔗 B${batchNumberMap[d.phone]}</span>` : ""}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">${d.product_name}</div>
        </div>
        <div class="mob-card-badges">
          <span class="badge badge-${d.status}">${d.status}</span>
          ${d.priority === "urgent" ? `<span class="badge" style="background:#fee2e2;color:#991b1b;">🔥</span>` : ""}
          ${ratingBadge(d)}
        </div>
      </div>
      <div class="mob-card-meta">
        <span>📞 <a class="phone-link" href="tel:${d.phone}" onclick="event.stopPropagation()">${d.phone}</a></span>
        <span>🚚 ${d.assigned_driver_name || "—"}</span>
        <span>⏱ ${formatDate(d.estimated_delivery_time)}</span>
      </div>
    `;
    return card;
  }

  const rendered = new Set();
  finalData.forEach(d => {
    if (rendered.has(d.id)) return;
    const isBatch = d.phone && batchPhones.includes(d.phone);
    if (isBatch) {
      const bNum    = batchNumberMap[d.phone];
      const palette = BATCH_PALETTES[(bNum - 1) % BATCH_PALETTES.length];
      const siblings = finalData.filter(x => x.phone === d.phone);
      const grp = document.createElement("div");
      grp.className = "mob-batch-group";
      grp.style.setProperty("--mob-batch-color", palette.border);
      grp.style.setProperty("--mob-batch-bg",    palette.bg);
      grp.style.setProperty("--mob-batch-text",  palette.text);
      const hdr = document.createElement("div");
      hdr.className = "mob-batch-group-header";
      hdr.innerHTML = `🔗 Batch ${bNum} · ${d.customer_name} · ${siblings.length} items`;
      grp.appendChild(hdr);
      siblings.forEach(item => { rendered.add(item.id); grp.appendChild(makeMobCard(item, palette)); });
      container.appendChild(grp);
    } else {
      rendered.add(d.id);
      container.appendChild(makeMobCard(d, null));
    }
  });
}

/* ── VIEW POPUP ── */
function openViewPopup(id) {
  const delivery = currentAccountantData.find(d => d.id === id);
  if (!delivery) return;

  const content = document.getElementById("viewContent");

  // Batch info using module-scope vars
  const BATCH_PALETTES = [
    { bg: "#f5f3ff", border: "#7c3aed", text: "#5b21b6" },
    { bg: "#fdf2f8", border: "#db2777", text: "#9d174d" },
    { bg: "#fff7ed", border: "#ea580c", text: "#9a3412" },
    { bg: "#f0fdf4", border: "#16a34a", text: "#065f46" },
    { bg: "#eff6ff", border: "#2563eb", text: "#1e3a8a" },
    { bg: "#fefce8", border: "#ca8a04", text: "#713f12" },
  ];
  let popupBatchRow = "";
  if (delivery.phone && batchPhones.includes(delivery.phone)) {
    const bNum    = batchNumberMap[delivery.phone];

        </div>` : ""}
      ${!delivery.product_returned ? `
        <div style="background:#fef9c3;border-radius:8px;padding:10px 12px;font-size:13px;color:#92400e;margin:10px 0;">
          ⚠ Reschedule is locked until product is marked as returned
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px;" onclick="markReturned('${delivery.id}')">
          📦 Mark Product Returned
        </button>` : `
        <div style="background:#dcfce7;border-radius:8px;padding:10px 12px;font-size:13px;color:#166534;margin:10px 0;">
          ✅ Product has been returned to warehouse
        </div>
        <button class="btn btn-success" style="width:100%;margin-top:8px;" onclick="openReschedule('${delivery.id}')">
          🔄 Reschedule Delivery
        </button>`}
    </div>` : ""}
  `;

  if (delivery.status?.toLowerCase() === "pending") {
    content.innerHTML += `<button class="btn btn-primary" style="margin-top:16px;" onclick="editDelivery('${delivery.id}')">✏ Edit</button>`;
  }

  document.getElementById("viewPopup").classList.add("is-open");
}

function closeViewPopup() {
  document.getElementById("viewPopup").classList.remove("is-open");
}

/* ── MARK PRODUCT RETURNED ── */
async function markReturned(id) {
  if (!confirm("Confirm that the product has physically returned to the warehouse?")) return;
  try {
    const res = await fetch(`${BASE_URL}/markReturned/${id}`, {
      method: "POST",
      headers: { Authorization: "Bearer " + localStorage.getItem("accountantToken") }
    });
    const data = await res.json();
    if (!res.ok) {
      if (res.status === 401) { handleAuthError(); return; }
      alert("⚠ " + (data.error || "Failed")); return;
    }
    closeViewPopup();
    loadDeliveries();
  } catch (e) {
    alert("⚠ Network error. Try again.");
  }
}

/* ── OPEN RESCHEDULE FORM ── */
async function openReschedule(id) {
  const delivery = currentAccountantData.find(d => d.id === id);
  if (!delivery) return;

  const res = await fetch(`${BASE_URL}/driver-list-public`);
  const drivers = await res.json();

  const inputStyle = "width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:14px;margin-bottom:8px;outline:none;";

  document.getElementById("viewContent").innerHTML = `
    <h3 style="margin-bottom:4px;">🔄 Reschedule Delivery</h3>
    <div style="font-size:13px;color:#64748b;margin-bottom:16px;">${delivery.customer_name} — ${delivery.product_name}</div>
    ${delivery.previous_failures > 0 ? `<div style="background:#fff1f2;border:1px solid #fca5a5;border-radius:8px;padding:10px 12px;font-size:13px;color:#991b1b;margin-bottom:12px;">⚠ Previous failure: ${delivery.failure_reason || "Unknown reason"}</div>` : ""}
    <div class="section-title">New Estimated Delivery Time *</div>
    <input type="datetime-local" id="reschedule_eta" style="${inputStyle}">
    <div class="section-title">Reassign Driver (optional — leave to keep current)</div>
    <select id="reschedule_driver" style="${inputStyle}">
      <option value="">— Keep current driver (${delivery.assigned_driver_name || "none"}) —</option>
    </select>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-success" onclick="saveReschedule('${id}')">✅ Confirm Reschedule</button>
      <button class="btn btn-gray" onclick="closeViewPopup()">Cancel</button>
    </div>
  `;

  const sel = document.getElementById("reschedule_driver");
  drivers.forEach(d => {
    const opt = document.createElement("option");
    opt.value = d.id;
    opt.textContent = d.driver_name + (d.id === delivery.assigned_driver_id ? " (current)" : "");
    sel.appendChild(opt);
  });
}

/* ── SAVE RESCHEDULE ── */
async function saveReschedule(id) {
  const eta = document.getElementById("reschedule_eta")?.value;
  if (!eta) { alert("Please set a new delivery time"); return; }
  if (new Date(eta) < new Date()) { alert("ETA must be in the future"); return; }

  const driverSel = document.getElementById("reschedule_driver");
  const driverId = driverSel?.value;
  const driverName = driverId ? driverSel.options[driverSel.selectedIndex]?.text?.replace(" (current)", "") : null;

  const body = { estimated_delivery_time: eta };
  if (driverId) { body.assigned_driver_id = driverId; body.assigned_driver_name = driverName; }

  try {
    const res = await fetch(`${BASE_URL}/rescheduleDelivery/${id}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + localStorage.getItem("accountantToken") },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) {
      if (res.status === 401) { handleAuthError(); return; }
      alert("⚠ " + (data.error || "Reschedule failed")); return;
    }
    closeViewPopup();
    loadDeliveries();
  } catch (e) {
    alert("⚠ Network error. Try again.");
  }
}

async function editDelivery(id) {
  const delivery = currentAccountantData.find(d => d.id === id);
  if (!delivery) return;

  const res = await fetch(`${BASE_URL}/driver-list-public`);
  const drivers = await res.json();

  const inputStyle = "width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:14px;margin-bottom:8px;outline:none;";

  document.getElementById("viewContent").innerHTML = `
    <h3 style="margin-bottom:16px;">Edit Delivery</h3>
    <div class="section-title">Customer Name</div>
    <input id="edit_name" value="${delivery.customer_name}" style="${inputStyle}">
    <div class="section-title">Phone</div>
    <input id="edit_phone" value="${delivery.phone}" style="${inputStyle}">
    <div class="section-title">Alternate Phone</div>
    <input id="edit_alt" value="${delivery.alternate_phone || ""}" style="${inputStyle}">
    <div class="section-title">Address</div>
    <textarea id="edit_address" style="${inputStyle}min-height:70px;">${delivery.address}</textarea>
    <div class="section-title">Product</div>
    <input id="edit_product" value="${delivery.product_name}" style="${inputStyle}">
    <div class="section-title">Serial Number</div>
    <input id="edit_serial" value="${delivery.product_serial_number || ""}" style="${inputStyle}">
    <div class="section-title">Estimated Delivery Time</div>
    <input type="datetime-local" id="edit_eta" value="${delivery.estimated_delivery_time ? new Date(delivery.estimated_delivery_time).toISOString().slice(0,16) : ""}" style="${inputStyle}">
    <div class="section-title">Assign Driver</div>
    <select id="edit_driver" style="${inputStyle}"></select>
    <div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-success" onclick="saveDelivery('${id}')">💾 Save Changes</button>
      <button class="btn btn-gray" onclick="closeViewPopup()">Cancel</button>
    </div>
  `;

  const driverSelect = document.getElementById("edit_driver");
  drivers.forEach(driver => {
    const option = document.createElement("option");
    option.value = driver.id; option.text = driver.driver_name;
    if (driver.id === delivery.assigned_driver_id) option.selected = true;
    driverSelect.appendChild(option);
  });

  const editEta = document.getElementById("edit_eta");
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  editEta.min = now.toISOString().slice(0, 16);
}

async function saveDelivery(id) {
  const driverSelect = document.getElementById("edit_driver");
  const updated = {
    customer_name:           document.getElementById("edit_name").value,
    phone:                   document.getElementById("edit_phone").value,
    alternate_phone:         document.getElementById("edit_alt").value,
    address:                 document.getElementById("edit_address").value,
    product_name:            document.getElementById("edit_product").value,
    product_serial_number:   document.getElementById("edit_serial").value,
    estimated_delivery_time: document.getElementById("edit_eta").value,
    assigned_driver_id:      driverSelect.value,
    assigned_driver_name:    driverSelect.options[driverSelect.selectedIndex].text
  };

  try {
    const res = await fetch(`${BASE_URL}/delivery/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(updated)
    });
    if (!res.ok) {
      const err = await res.json();
      alert("⚠ " + (err.error || "Edit failed"));
      return;
    }
    closeViewPopup();
    loadDeliveries();
  } catch (e) {
    alert("⚠ Network error. Please try again.");
  }
}

/* ── CSV EXPORT ── */
function exportToCSV() {
  if (!currentAccountantData.length) { alert("No data to export"); return; }

  const headers = ["Customer","Phone","Alt Phone","Address","Product","Serial","Invoice","Priority","Status","Rating","Batch","ETA","Driver","Instructions","Freight","Freight Amount","Created","Loaded At","Delivered At"];
  const rows = currentAccountantData.map(d => {
    const ts = t => t ? new Date(t.seconds * 1000).toLocaleString("en-IN") : "";
    let rating = "";
    if (d.status === "delivered" && d.delivered_timestamp && d.estimated_delivery_time) {
      const diff = (new Date(d.delivered_timestamp.seconds*1000) - new Date(d.estimated_delivery_time)) / 60000;
      rating = diff <= -10 ? "Early" : diff <= 10 ? "On Time" : diff <= 30 ? "Late" : "Very Late";
    }
    const batch = (d.phone && batchPhones.includes(d.phone)) ? "Batch " + batchNumberMap[d.phone] : "";
    return [
      d.customer_name, d.phone, d.alternate_phone || "", d.address,
      d.product_name, d.product_serial_number || "", d.invoice_number || "",
      d.priority, d.status, rating, batch, d.estimated_delivery_time || "",
      d.assigned_driver_name || "", d.driver_instructions || "",
      d.freight_charged ? "Yes" : "No", d.freight_amount || "",
      ts(d.created_timestamp), ts(d.loaded_timestamp), ts(d.delivered_timestamp)
    ].map(v => { const s = String(v || "").replace(/"/g, "\"\""); return "\"" + s + "\""; }).join(",");
  });

  const csv  = [headers.join(","), ...rows].join("\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement("a"), {
    href: url,
    download: `hariom_deliveries_${new Date().toISOString().slice(0,10)}.csv`
  });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
</script>
